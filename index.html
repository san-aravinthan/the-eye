al blow, but I kept him from advancing forwards.", "Finally, the grab pulled Win back with so much force that he crashed into a wall back-first. Struggling to get up, he started towards Kreigh again.", "I sprinted over behind Win, putting him in a headlock, restraining the misunderstood rebel. He flailed around, finally hitting me in the stomach, which caused me to loosen my grip on him.", "That was enough for him to escape. He wriggled away like a slippery fish, continuing to advance. Kreigh, who was finally alert after just standing there in shock for a few minutes, knocked Win back and proceeded to speak.", "“Win Setose, you are a traitor, a disgrace to humanity. It is in our best interest that you are promptly exiled. So be it. You will no longer be welcome to live under the roofs of the Rebellion. From now on, you shall live as scum in the streets or worse scum in the Haven. The choice is yours. From now on, you are not a rebel anymore. Until our paths cross again,” Kreigh declared.", "“You murderer! Don’t you know how much suffering you’ve caused me? And now I have no home! No friends! Nothing!” Win lamented.", "Win charged at Kreigh letting out a battle cry, sword drawn, ready to deal a fatal blow on Kreigh’s head. However, Kreigh swiftly dodged to the right, and aimed a spell at Win’s side.", "Immediately, Win spun midair, but he definitely didn’t know what Kreigh was trying to do. Turning, of course, was a bad idea.", "Kreigh conjured up a burning piece of wood, or did he just summon it? I swear that there was a burning beam just disappearing from the ruins of the Base.", "The wind from Win’s tunic swirled around and the flames leaped higher, threatening to burn him to ashes. Kreigh muttered another spell, summoning a dagger. It hit Win between the ribs, making him fall closer to the flames. The blaze leaped and kindled a tiny flame on the tunic, hot embers dropping onto the floor.", "The tunic caught fire, and Win screamed as he dropped to the ground, rolling.", "In the midst of his struggle to put the fire out, he rolled over some sharp stones produced from the initial blast, leaving deep wounds. I really thought, but hoped otherwise, that he would die shortly after. I knew his limits, and I knew the point that he would break, give up, and get it over with.", "Win proved me wrong yet again. He got up and flew into a rage.", "“Hey, calm down! Kreigh didn’t kill Gnarn! I swear! He didn’t do it! I was there!” I shouted after him, trying to tell him the truth.", "“Now you are also defending the murderer? I can’t believe that one of my closest companions would betray me!” Win yelled, spittle flying from his mouth. But then he coughed, and coughed. He coughed some more, and spat blood. He collapsed, exhausted.", "Rushing to Win, we gathered around him. His breathing was shallow, and blood was running down the side of his mouth and was splattered all over his tunic.", "“You killed my father!” he spat.", "“No!” I rebuked. “It was the Axis Piece! The Rebellion did nothing!” A vision appeared showing Gnarn struggling in a room at night. It was tinged in purple. Gnarn’s Axis Piece was glowing blue, not warm like Kreigh’s but it was a cold, sickly blue. Finally, Gnarn seemed to snap out of a trance, and the Piece stopped glowing. Win’s eyes widened at the sight when he realized that it was the Axis Piece all along.", "“I’m sorry, Kreigh,” he croaked, “I thought you and the rest of the Rebellion killed my father. But I was wrong. I couldn’t stop myself from taking the steps. I was so angry that I wanted to take it out on everyone. Even my best friends. And my apologies, Nyk, for framing you.”", "“It’s okay. It could have been worse than that,” I whispered, comforting him.", "“Win, your father’s Axis Piece, this pyramid, corrupted him and drove him mad,” Kreigh explained, “he was a brave man. He withstood the corruption for long, but he couldn’t keep it up and died from exhaustion in the end.”", "“Well, that’s good to know,” Win continued with great effort, “Stay vigilant. Courage is eternal. ”", "He reached into a pocket and held out a tiny iridescent crystal, handing it over to me.", "With one final gasp, he collapsed, lifeless."], "tall": true}, {"id": "chapter-31", "n": "31", "label": "Chapter 31", "title": "Vengeance", "img": "32.jpg", "paras": ["Win had a hero’s funeral, and the long line of rebels wound around to pay their last respects to their misunderstood friend. They passed one by one, whispering a prayer and dropping a gift into the coffin.", "I was still in the middle of the line. My head rang mysteriously, and I dropped to the floor.", "“You okay?” the person behind me asked, helping me up.", "“Nothing’s been the same since he passed,” I replied, referring to Win.", "“I know. It is for all of us,” they agreed.", "There was nobody in line in front of me, so I stepped up to the grave for my last tributes.", "“Please forgive me. My dearest friend, you will be remembered and respected, forever. Please protect me and all the rebels, for we shall one day do what you could only do during your dreams. We shall take down the Grand Xenoph once and for all,” I whispered.", "The blinding flash struck me again.", "Win’s sudden betrayal and death caught me off guard. Surprisingly, I still felt Win was my friend, not an enemy. Win was just, mixed up, misunderstood. Then, I remembered the real enemies. Reaper. General Darkblade. Ivan. The Grand Xenoph. <em>We must avenge Win<\/em>, the Gem echoed in my head. It was the Haven that split the Axis. It was the Haven that killed Gnarn. It was the Haven that turned the Earth into a hellhole, and destroyed any hope humanity had. Numbness turned to rage, which turned to fury. The power of the Gem electrified around me. I stood up while Kreigh was giving some important speech, and stormed out of the door.", "“Nyk,” Kriegh warned. “Where are you going?”", "“I'm gonna use the Gem to destroy the Haven! I can’t let Win die in vain!” I responded.", "“Going is a bad idea,” Eliza protested.", "“I don’t care! There is no other way to stop it!”", "“You are blinded by vengeance!” Kreigh warned.", "“And you aren’t? Day after day, the Haven keeps taking everything we ever dreamed of. Our freedom. Gnarn. Win! I want to tear that pyramid down!” I seethed.", "“I feel the same pain and rage you feel”, Kreigh started. “But it’s a death sentence to try to destroy the Haven now!”", "“I have to! I will not let them take away everything from us again!” I snarled.", "“Nyk, please,” Myke started.", "I let out a blast of energy in the air, causing the ceiling to shatter. There were a few gasps, but otherwise, silence. I then stormed off, with Kreigh trying to follow me, but I jumped in the airship, using RAD and Gem energy to fire it up. The airship blasted off, and launched towards the Haven. It blasted through the wall, knocking it down. I jumped off of the airship, which blew up behind my back. It was time to destroy The Grand Xenoph."], "tall": false}, {"id": "chapter-32", "n": "32", "label": "Chapter 32", "title": "Confrontation", "img": "33.jpg", "paras": ["I ran towards the brass doors of the throne room, when a white blast hit me in the side. I rolled over, knocking my head against the wall. I almost fell unconscious, but I got up this time, rubbing my head. Looking around, I saw no sign of an attacker. My gaze scoured every single hiding place, until I came across a white eye, staring at me.", "“Reaper,” I spat out with disgust. However, I’m sure my voice had a hint of surprise. <em>How did he survive the fire?<\/em> Nonetheless, I ran towards him. Though I was confident that we needed to exterminate this adversary, I had a slight bit of misgivings about this action. Hastening with my first action, I rushed towards him and punched him in the nose, jutting out my knee. Reaper’s hands illuminated with white-hot embers, and shot them towards the roof. Debris fell down, forcing me to dodge. However, this was part of his tactic, as he fired a strong white beam, knocking me back through a wall. I struggled to my feet, but was quickly shot down by a roundhouse kick to my shoulder. Pain seared through my bones as I felt them contort. I grabbed Reaper and kneed him in the abdomen. He spat out blood, but he swung a backfist into my side, causing me to fall on some broken glass. I stood up, wiping blood off my cheek and jumped against the roof using Gem energy, and jumped down, gravity causing me to gain momentum. I was like a human missile. I slammed into Reaper, causing him to sink through the floor. However, I lost my balance and fell through the hole. Reaper clasped me by the shirt, and we spun around in the air, trading blows. Reaper hit me smack in the jaw, and I tasted the coppery tang of blood in my mouth. To retaliate, I rapidly charged a punch and hit him in the ribs. Reaper spun backwards, but gained more power from the Eye, launching a devastating blast. I countered with my own attack from the Gem, and the combined energy gave away to an explosion. We hit the ground, and Reaper quickly got to his feet and pushed me against the wall. Bruises were everywhere on my body, and I barely had the stamina to keep fighting. Reaper tossed me aside like a rag doll, and charged up a white ball of energy. I stood up, purple electricity wrapping around my fists, and I rushed at Reaper, knocking him off balance. The ball of energy hit the roof, causing a large chunk of rock to fall upon us. Reaper looked up in surprise, and raised his hands in defense. However, the tons of rock hit his hand, causing him to fall to his knees. The Gem created a purple shield, which shielded me from the rubble. Reaper created a wall using dirt, the Eye swirling it around like a tornado, deflecting the debris and launching them at my shield. However, he didn’t know I had the Phoenix Talon Grab.", "Launching myself past the barrier and out into the open, I noticed Reaper’s grinning face from behind the earthen wall. Expecting me to get crushed by the rockslide, he did nothing to stop me from my next action.", "I grabbed as much of the crumbling structure as I could, compacting it into a heavy ball. Remembering the weight reduction enchantment, I whispered it, activating the crystal that Win gave me. The shot put was now complete, and the dust had settled. But I wasn’t about to let the fun end. I grabbed the barrier Reaper was hiding behind, and added that to my deadly attack. Winding up and throwing like a baseball pitcher, doing better than any Olympic shot put athlete could ever do.", "Reaper didn’t even have time to evade, and he was hit square in the forehead. He got launched a few feet back, but rolled backwards and landed on his feet. I immediately launched myself at Reaper again, and used the Phoenix Talon Grab to grasp his shoulder. I felt the bone crunch under the pressure, but Reaper swung a charged punch at me, and I staggered back. My energy low, I collapsed to the ground, Reaper laughing in my face.", "“Not so tough now, eh?” he smirked.", "He then bolted behind me and slammed his elbow into my back. I fell over, air leaving my lungs. Reaper then gripped me hard in the back of the neck, pulling me back behind him. He swiftly spun around and kneed me directly in the chest. I barely had time to pull up a shield with the Gem. After I blocked, I went on the offensive, trying to land blows. But the powerful hits Reaper dealt on me took a toll, and Reaper swiftly dodged every blow, and countered a few times. I had no choice but to hold up my shield as Reaper ruthlessly dealt blows. As I inched closer to the wall, Reaper launched a blast, forming a large hole. I could see that I was thousands of feet above the ground. Reaper kept dealing nearly lightspeed blows, as I moved closer towards the edge of the hole. Then, Reaper launched a powerful blast, and I fell backwards. I managed to hang on for dear life. Reaper stood above me, grinning. I was completely at his mercy,", "“No friends to save you this time”, sneered Reaper. “Where are they? They tried to stop you, but you couldn’t control your own anger.”", "“Don’t talk about my friends,” I snarled back.", "“Goodbye, Nyk,” Reaper declared triumphantly", "Reaper stepped on my hand, sending searing pain through my hand. He moved his foot, causing me to lose my grip, and fall off of the Haven. And just like that, it was over."], "tall": false}, {"id": "chapter-33", "n": "33", "label": "Chapter 33", "title": "Redemption", "img": "34.jpg", "paras": ["As I slowly fell towards the pavement, I looked up at the Haven, the malignant eye sculpture still staring upon the world. The troopers will definitely recover the Gem. Grand Xenoph will have two of the most powerful axis pieces, all because of me. The Rebellion lost. Suddenly, the voice of the Gem rang in my head.", "<em>It can’t end like this! It won’t end like this!<\/em>", "I scanned the area for a way to escape, and found nothing but a lone Eye of Providence patrolling the streets, but that was enough.", "I reached out as far as I could, and gripped it on the top. I infused the EOP with the Gem energy, and steered it upwards. It propelled towards the hole that I fell out of, and Reaper only had time to look around before I jumped straight off of the EOP, and landed, rolling to brace myself. Reaper crossed his arms to block, but the EOP still slammed into him with ludicrous speeds, launching him into the door. The impact was so powerful that cracks appeared on the giant double doors to the throne room.", "I was ready to deal the finishing blow with a punch straight to Reaper’s chest, but he rolled away at the last second, and swiftly got up. He fired a brilliant white laser, but I countered with my own purple laser.", "“Your friends tried to warn you, didn’t they?” taunted Reaper.", "“You hurt too many people, Reaper!” I retorted. “All this carnage ends here and now!” I siphoned", "more of my energy into my laser, which pushed Reaper back. He was sent flying into a wall, but", "quickly bounced off, and used his clawed gloves to deal a powerful scratch on my side.", "I clutched my side as blood rushed out of it. I fell to my knees in pain, and before I could use the Gem to heal, Reaper uppercut me, making me fall backwards.", "“I was under the impression that you cared about them,” continued Reaper as he circled me.", "“How do you think they will feel once they see you dead?”", "“You and the Republic killed Gnarn! You cause nothing but suffering to humanity!” I snarled.", "“Even Win would be disappointed. It’s a shame that he passed.”", "Fueled by a newfound rage, I launched myself back up, and threw myself at Reaper. We traded blows, and even though I got punched multiple times, my rage kept me resilient. As I kept advancing on Reaper, his eyes started to widen in shock, as if he couldn’t believe I was getting this powerful.", "I slammed my heel as hard as I could into Reaper’s chest, launching him into a wall. I immediately clutched the back of his neck, and flung him to the other side.", "Reaper tried to block, but the sheer power of the Gem forced his arms apart. I roundhouse kicked him in the left side of his head, and hooked him in the other side, before dealing blows on his face. He crumpled to the ground, but he still refused to give up. As I ran towards him, he swiftly dodged and used the last of his strength to slam me into the wall. While I was pinned, he used the Eye to regenerate and once he got his strength back, he immediately suplexed my body on the floor. I struggled and tried to escape, but Reaper was too strong.", "Reaper then shot an icy glance at me, covering his other eye. I just turned around when the Eye glowed a luminescent purple, and then, I felt a pull inside of my chest.", "<em>Oh no. Not again.<\/em>", "I felt my power drain, like someone took a syringe and extracted it out of me.", "“You are nothing without your Axis Piece,” Reaper growled ominously, “Your days of striking fear in the hearts of the Republic are over. Prepare to die, Nyk Valios.”", "I watched apprehensively as he raised his hands to strike, but apparently, he did nothing. Reaper’s face turned bright red.", "“Why isn’t it working?” he bellowed, “Why can’t I kill you?” I looked with realization. Reaper was also nothing without his piece. We were at a standstill. Or, so I thought.", "Suddenly, Reaper pulled out a scythe of jade. It glimmered a dark green, with blood-red letters etched onto it. In the dark Haven Halls, I could only make out: “Death.” He rushed towards me, threatening to chop me in two. In panic, I unstrapped the Jailbreaker and rushed towards Reaper. I didn’t need the Gem to fight. I could rely on myself. Reaper looked in surprise as I swung the weapon against his chin. He fell back, and I fired wind arrows at him, blasting him through a wall. Then, I ran forward and smacked his jawbone with the Jailbreaker. Reaper spat out blood, and looked at me in fear, as I prepared to deal the finishing blow. But then, I saw something. I used to only see evil in his eyes, but now, I felt as if his vision had cleared up. I saw something else. A feeling of worthlessness. A feeling of wanting to stand out. A feeling of wanting recognition. But I needed more. I needed to give him something he would remember. A lesson. Whispering my advice, I imbued the Jailbreaker with it and charged up a hit. I struck hard and true, snapping his scythe in half. Reaper looked at me in surprise.", "“Why-” he stumbled over his words in confusion. “Why did you spare me?”", "Then his expression changed, getting the message.", "“Oh, what do I do now, after serving the true evil for so long? What will become of me?” Reaper lamented.", "“It’s okay,” I soothed. “Everyone wants to stand out.” I sat down beside him. “But it is the way you stand out that matters. It’s not too late to make the right choice.” Reaper looked in the distance, swaying as he finally understood the beauty of the wind. He stood up.", "“Then let’s do it,” he affirmed.", "Suddenly, I felt purple energy rush through me. I looked to my right, and saw Reaper’s face flush with white energy. The synergy did something new. The Gem and the Eye didn’t fight. They were working together. Trooper IIs flooded the room, as they noticed the collateral damage in the Haven. Reaper smirked at me in determination. I smiled back. Then, we ran into battle."], "tall": false}, {"id": "chapter-34", "n": "34", "label": "Chapter 34", "title": "Endgame", "img": "35.jpg", "paras": ["Like an unstoppable tsunami, we ripped through the enemy forces. I leaped on a Trooper, and used it to propel me into Reaper’s arms. Reaper spun me around and launched me like a missile, causing a giant explosion. The Gem energy left me unharmed. Like scissors through paper, we pushed on, knocking down Troopers in our path. Reaper picked up a piece of his scythe, and used it as a boomerang. The jade projectile knocked out a few hundred Troopers before returning cleanly into Reaper’s hand. Then, we noticed the brass doors. The entire reason I came here. We glanced at each other briefly, and ran towards the large entrance. Troopers made futile attempts to stop us, but we easily made it past them, and kicked down the door. Now, harder enemies awaited us; the Eyes of Providence, the aliens that took over this world. They put up a good fight, but so does your dog when you try to pick it up. We knocked out some of the Eyes, until suddenly, I felt my power drain again. I looked behind me, and saw Ivan, a machine on his arm, trying to siphon the Eye and the Gem out of our bodies. I struggled against it, and saw the Gem spiral in the air helplessly. Reaper looked at me one more time, and pushed me aside, freeing the Gem. However, that meant all the energy siphoning was draining all his energy. He fell to the ground, as the Eye left, and got absorbed into Ivan’s machine, along with Reaper’s energy. Reaper croaked out one last message, barely a whisper.", "“You were right. I should stand out in the right way. You will stop him.” He crumpled to the floor, the color draining from his skin, as his eyes started to dim.", "“No!” I cried out, as Ivan looked at me, smiling.", "“The Grand Xenoph will be pleased now that I got one of the two Master Pieces.” Ivan sneered. I ran towards him in blind rage, but Ivan created a shield with the Eye and pushed, knocking me out of a wall in the Haven.", "Suddenly, a blue platform rushed towards me, and Myke grabbed me by my shirt, and pulled me on.", "“Myke?” I stuttered.", "“Come on,” he replied. “If you run off like that, we need to join in on the fun!” Ivan, with the newfound power of Reaper and the Eye, chases after us on his own platform, firing green-white projectiles. Eliza, Myke and I work together to deflect them, pushing us well away from Ivan. Kreigh speeds up the platform, but Eliza’s sword gets knocked away by a blast, falling onto the city. I aimed RAD, firing at Ivan. Suddenly, a white blast hits me off of the platform. Eliza grabs me, but as my eyes follow the white blast, I see General Darkblade on his own platform. Flanking us, multiple blasts fired through the air as we ducked to avoid them all. One of them hit Kreigh’s metal leg, causing him to flip over, losing it.", "“Don’t worry,” he growled in his usual gruff voice. “I’ll get a new one.” I looked at General Darkblade and Ivan, and rage fueled me. I created a purple ball of Gem energy. This was for Win. For Reaper. For the world. I expanded it into an EMP, knocking General Darkblade and Ivan off of their platforms. But, at the last second, they used the Haven’s superior technology to warp away to the Haven, shooting us one last smug look.", "We lost. We lost Reaper. We lost the Eye. We lost our chance to kill Ivan and General Darkblade. We lost everything."], "tall": false}, {"id": "chapter-35", "n": "35", "label": "Chapter 35", "title": "Hope", "img": "36.jpg", "paras": ["When we got back to the remains of the Rebel base, I buried my head in my arms, grief washing over me like a tide at the beach. I felt someone sit down next to me, and I looked up. Myke’s eyes, which used to be filled with bubbling joy and mischief, were now filled with concern as he looked at me.", "“We lost Reaper,” I whimpered. “We can’t beat the Republic.”", "“We didn’t lose everything,” Myke pointed out. “We can still fight.”", "“But how?” I murmured depressed. “They have a Master Piece. The Grand Xenoph is more powerful, and can obliterate us with a wave.”", "“He still needs to stabilize the energy,” Myke indicated, “And plus, he needs time to absorb it, too. We still have a chance. Remember, hope will always be there.”", "I looked at Myke. Who knew this jokester could say such wise words? I smiled to myself. I guess it will. I stood up, and looked at Kreigh, who was sorting through some documents he found in the Haven.", "“Guys,” he called as he adjusted his temporary wooden leg. “You might want to check this out.”", "We walked to Kreigh’s desk, and saw something magnificent.", "A map.", "A full blown map of the Haven, and New York. I couldn’t believe my eyes. We didn’t need to rely on Eliza as the only source, as she only knew part of the Haven. We still had a chance. Eliza looked at me and smiled, joy showing in her eyes. I smiled back, thankful for my friends, Myke, Eliza and Kreigh. Without them, I wouldn’t have made it this far. I owed them something.", "“I’m sorry for running off like that,” I confessed, guilt suddenly flushing over me.", "“It’s alright,” Eliza responded. “You were mad. We all were. But you are here now, and we will defeat The Grand Xenoph.”", "“Now,” Myke began. “Who wants to play 4D Chess?”", "I laughed. This was Myke’s favorite game, even if we all sucked at it, wormholes and all. I smiled to myself, and felt a small familiar ring in my head.", "<em>Our mission is not over Nyk<\/em>, echoed the familiar voice of the Gem. <em>We will bring justice.<\/em>", "<em>Justice.<\/em>"], "tall": false}, {"id": "epilogue", "n": "E", "label": "Epilogue", "title": "Epilogue", "img": "37.jpg", "paras": ["The Grand Xenoph opened his eye to see Ivan Damazcus walking in with a small box, with General Darkblade beside him.", "“What is it that you bring me, Ivan?” Grand Xenoph croaked.", "“I have bought you an Axis Piece, my lord.” Ivan replied. “But not any Axis Piece. I brought the Eye!”", "Grand Xenoph’s eye widened with shock. One of the two Master Pieces was in the palm of his hand. “Amazing work, Ivan. This is why you are my most trusted servant.” Grand Xenoph rasped.", "“Thank you.” Ivan’s chest swelled with pride", "“I mean, I did lead the entire forces into finding and destroying the rebel base,” muttered General Darkblade.", "“Silence!” Roared Ivan. “Anyways, I hope you are pleased. What shall be the next course of action, your majesty?”", "Grand Xenoph’s mind raced. He knew that the other Master Piece, the Gem, belonged to a boy named Nyk. He closed his eye, allowing him to be lost in thought. He saw the rebels, scurrying across the street. Their base was destroyed by a wayward member.", "He opened his eye. What was next was clear.", "“Find the boy. We need the Gem to find the other pieces.”", "“Yes, my lord,” Ivan muttered. “We shall finally finish Purgatory."]}, {"id": "book-2", "n": "II", "label": "Sneak preview", "title": "Book 2: The Brain", "img": "38.jpg", "intro": "We’re making a trilogy, so enjoy the first chapter for our second book!", "subtitle": "Prologue for Book 2", "paras": ["In the silent New York Harbor, everything seemed to slow to a stop. Jellyfish pulsed with light, yet didn’t contract their bells to move anywhere. Fish slept in the deep of their night, their unblinking eyes fixated on the waveless surface.", "Rays lay hidden in the seabed, drifting off to who knows where. The sharks even slept in harmony with the very fish that they preyed upon.", "But then a single rock moved on the seabed. Then another.", "Sand began to rise and fall off of a rusted, ancient, metallic form, and a clear glass dome emerged from under the sand, hidden away for a long time.", "Emitting a warm turquoise light, it started spitting out bubbles in all directions, revealing more of the body of the slumbering metal beast.", "And above on the surface, humanoid construction robots began marching into the sea, never to be seen again.", "New York Harbor lay still once more.", "On land, in the part of New York City once known as Manhattan, shapes scuttled around in the shadows, while the holy Grand Xenoph and his acolytes returned to their dormitories to sleep.", "Someone was up to no good.", "The rebels with no home ran about in the shadows of the sleeping city, fleeing the constant patrols and searchlights raining down on them from the giant, floating, glowing stone pyramid above. Dedicating their entire lives to opposing the Grand Xenoph’s oppressive regime, they fought back day by day, even with no shelter to shield them from the prying eyes of the alien overlord. The rebels, finding a safe spot to temporarily rest for the night, entered and kept quiet.", "Though there was not even a noise in the city, everyone could hear one thing loud and clear.", "The song of the ocean called to all.", "The tides of change were rising."]}, {"id": "about", "n": "★", "label": "About", "title": "The Authors", "img": "cover.jpg", "kind": "about", "authors": ["Nitesh Aravinthan: Nitesh is a 13-year-old boy who came up with the project after watching a dystopian movie. He likes coding, coming up with stories, gaming and drawing. He has an extreme obsession with Sonic the Hedgehog. He probably watched too many movies, but that’s a good thing for his cinematic writing style.", "Jason Wang: 12-year old friend of Nitesh. Also loves coding and gaming. Close friend of the Aravinthans (including the Sonic obsession) and likes music. Has even performed piano at Carnegie Hall three times already! Wrote A LOT on this novel. Part const EYE = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4 36 34H4Z" fill="none" stroke="#b88cff" stroke-width="1.6" stroke-linejoin="round"/><path d="M11 24q9-8 18 0q-9 8-18 0Z" fill="none" stroke="#9d95ab" stroke-width="1.4"/><circle cx="20" cy="24" r="2.4" fill="#b88cff"/></svg>';
const $ = s => document.querySelector(s);
const main = $('#main');
const S = STORY.sections;
const byId = Object.fromEntries(S.map((s,i)=>[s.id,i]));
let store = {}; try{ store = JSON.parse(localStorage.getItem('theEye')||'{}'); }catch(e){}
const save = () => { try{ localStorage.setItem('theEye', JSON.stringify(store)); }catch(e){} };
if(store.fs) document.documentElement.style.setProperty('--fs', store.fs+'rem');

function esc(t){ return t.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function tocHTML(cur){
  return S.map(s=>`<a href="#${s.id}" ${s.id===cur?'aria-current="page"':''}><img loading="lazy" src="thumbs/${s.img}" alt=""><span><span class="k">${esc(s.label)}</span><span class="t">${esc(s.title)}</span></span></a>`).join('');
}

function renderHome(){
  document.title = 'The Eye';
  $('#where').textContent = '';
  const last = store.last && byId[store.last]!==undefined ? S[byId[store.last]] : null;
  main.innerHTML = `
  <section class="hero">
    <div>
      <p class="kicker">Book one of a trilogy &middot; New York, 3024</p>
      <h1>THE<span>EYE</span></h1>
      <p class="lede">Thirteen-year-old <b>Nyk</b> trades scraps for rations under a floating pyramid that never stops watching. Then an old man with a glowing staff calls him <b>the chosen one</b>, and the race for the 37 pieces of the Axis begins.</p>
      <p class="byline">Written by <b>Nitesh Aravinthan</b>, <b>Aadesh Aravinthan</b> &amp; <b>Jason Wang</b></p>
      <div class="ctas">
        <a class="cta" href="#${S[0].id}">Start reading</a>
        ${last && last.id!==S[0].id ? `<a class="cta ghost" href="#${last.id}">Continue: ${esc(last.label)}</a>` : ''}
      </div>
    </div>
    <div class="watch" id="watch">
      <svg viewBox="0 0 400 400" role="img" aria-label="The Haven: a pyramid with a watching eye">
        <defs>
          <radialGradient id="g" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#b88cff" stop-opacity=".35"/><stop offset="1" stop-color="#b88cff" stop-opacity="0"/></radialGradient>
          <pattern id="bricks" width="40" height="20" patternUnits="userSpaceOnUse"><path d="M0 0H40M0 10H40M20 0V10M0 10V20M40 10V20" stroke="#ffffff10" stroke-width="1"/></pattern>
          <clipPath id="eyeClip"><path d="M100 250Q200 160 300 250Q200 340 100 250Z"/></clipPath>
        </defs>
        <circle cx="200" cy="240" r="190" fill="url(#g)"/>
        <path d="M200 30 380 370H20Z" fill="#16131d" stroke="#2a2533" stroke-width="2"/>
        <path d="M200 30 380 370H20Z" fill="url(#bricks)"/>
        <path d="M200 30 380 370H20Z" fill="none" stroke="#79e39a" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="3 9"/>
        <path d="M100 250Q200 160 300 250Q200 340 100 250Z" fill="#e9e4f0"/>
        <g clip-path="url(#eyeClip)"><g id="pupil"><path d="M188 212l12-14 12 14v72l-12 10-12-10Z" fill="#7d4cd6"/><path d="M200 198l12 14v72l-12 10Z" fill="#b88cff"/></g></g>
        <path d="M100 250Q200 160 300 250Q200 340 100 250Z" fill="none" stroke="#0c0a11" stroke-width="4"/>
      </svg>
      <figure class="cover-card"><img src="images/cover.jpg" alt="The original book cover of The Eye"><figcaption>Original cover &middot; Niv Patel</figcaption></figure>
    </div>
  </section>
  <section class="contents" aria-labelledby="ch">
    <h2 id="ch">Contents</h2>
    <p class="note">The prologue, all 35 chapters, the epilogue and a sneak peek at Book 2. Pick any plate to jump in.</p>
    <div class="grid">${S.map(s=>`
      <a class="plate ${last&&last.id===s.id?'here':''}" href="#${s.id}">
        <div class="pic"><img loading="lazy" src="thumbs/${s.img}" alt="Illustration for ${esc(s.label)}"></div>
        <div class="cap"><span class="num">${s.n}</span><span><span class="k">${last&&last.id===s.id?'You stopped here':esc(s.label)}</span><span class="t">${esc(s.title)}</span></span></div>
      </a>`).join('')}
    </div>
  </section>`;
  // the eye follows you
  const pupil = $('#pupil'), watch = $('#watch');
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    window.onpointermove = e => {
      if(!pupil.isConnected) return;
      const r = watch.getBoundingClientRect();
      const dx = (e.clientX - (r.left + r.width/2)) / innerWidth, dy = (e.clientY - (r.top + r.height*.62)) / innerHeight;
      pupil.setAttribute('transform', `translate(${Math.max(-1,Math.min(1,dx*2))*60} ${Math.max(-1,Math.min(1,dy*2))*16})`);
    };
  }
  window.scrollTo(0,0);
}

function para(p){
  if(p==='<hr>') return `<div class="brk">${EYE}</div>`;
  const voice = /^<em>[^]*<\/em>$/.test(p) && !/<\/em>[^<]+<em>/.test(p.replace(/<\/em> <em>/g,' '));
  return `<p${voice?' class="voice"':''}>${p}</p>`;
}

function renderSection(i){
  const s = S[i];
  document.title = `${s.label}: ${s.title} · The Eye`;
  $('#where').textContent = s.label === s.title ? s.label : `${s.label} · ${s.title}`;
  let body = '';
  if(s.kind==='about'){
    body = `<div class="prose plain">${s.authors.map(a=>`<p>${a}</p>`).join('')}
      <div class="credits">${s.credits.map(c=>`<h3>${esc(c[0])}</h3>${c[1].map(esc).join('<br>')}`).join('')}</div>
      <p class="shout" style="margin-top:2.4em">${esc(s.shout)}</p><p class="chain">${esc(s.chain)}</p></div>`;
  } else {
    body = `<div class="prose">${(s.intro?`<p><em>${esc(s.intro)}</em></p><h3 class="sub">${esc(s.subtitle)}</h3>`:'')}${s.paras.map(para).join('')}</div>`;
  }
  const prev = S[i-1], next = S[i+1];
  const link = (x,cls,dir) => x ? `<a class="${cls}" href="#${x.id}"><img loading="lazy" src="thumbs/${x.img}" alt=""><span><span class="d">${dir}</span><br><span class="t">${esc(x.label===x.title?x.title:x.label+': '+x.title)}</span></span></a>` : `<span class="empty"></span>`;
  main.innerHTML = `
    <div class="stage"><figure class="${s.tall?'tall':''}" id="plate"><img src="images/${s.img}" alt="Illustration for ${esc(s.label)}: ${esc(s.title)}"><span class="zoom">Tap to enlarge</span></figure></div>
    <article class="chapter"><header><div class="k">${esc(s.label)}</div><h2>${esc(s.title)}</h2></header>${body}</article>
    <nav class="pager" aria-label="Chapter navigation">${link(prev,'prev','&larr; Previous')}${link(next,'next','Next &rarr;')}</nav>`;
  $('#plate').onclick = () => { $('#lbImg').src = `images/${s.img}`; $('#lbImg').alt = `Illustration for ${s.label}`; $('#lb').classList.add('on'); };
  store.last = s.id; save();
  window.onpointermove = null;
  window.scrollTo(0,0);
}

function route(){
  const id = location.hash.slice(1);
  const i = byId[id];
  document.body.classList.remove('open');
  $('#toc').innerHTML = tocHTML(id);
  if(i===undefined) renderHome(); else renderSection(i);
  $('#prevBtn').disabled = !(i>0); $('#nextBtn').style.visibility = '';
  onScroll();
}
function go(d){
  const i = byId[location.hash.slice(1)];
  if(i===undefined){ if(d>0) location.hash = S[0].id; return; }
  const j = i + d; if(j<0) location.hash='home'; else if(j<S.length) location.hash = S[j].id;
}
function onScroll(){
  const h = document.documentElement; const max = h.scrollHeight - innerHeight;
  $('#progress').style.width = (byId[location.hash.slice(1)]===undefined || max<=0 ? 0 : Math.min(100, h.scrollTop/max*100)) + '%';
}
addEventListener('hashchange', route);
addEventListener('scroll', onScroll, {passive:true});
addEventListener('keydown', e => {
  if(e.key==='Escape'){ $('#lb').classList.remove('on'); document.body.classList.remove('open'); }
  if(e.target.closest && e.target.closest('input,textarea')) return;
  if(e.key==='ArrowRight') go(1);
  if(e.key==='ArrowLeft') go(-1);
});
$('#menuBtn').onclick = () => document.body.classList.add('open');
$('#closeBtn').onclick = $('#scrim').onclick = () => document.body.classList.remove('open');
$('#lb').onclick = () => $('#lb').classList.remove('on');
$('#prevBtn').onclick = () => go(-1);
$('#nextBtn').onclick = () => go(1);
const size = d => { const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs')) || 1.125; const v = Math.max(.95, Math.min(1.5, +(cur + d).toFixed(3))); document.documentElement.style.setProperty('--fs', v+'rem'); store.fs = v; save(); };
$('#smaller').onclick = () => size(-.0625);
$('#bigger').onclick = () => size(.0625);
route();
</script>

to my side.", "“Several more! With loose papers stuffed inside! And wait, there’s text!” I observed.", "“So this is the text!”", "“Yes, Myke, we both know.”", "“Long ago, there was a—”", "“Let me read!”", "“Fine…”", "“There was a very powerful relic called the Axis, from a higher dimension. Many eons ago, it got sent to our dimension. How is currently unknown. It was later discovered by a simple family in the countryside. They didn’t know what it really was, but all they knew was that it brought the rains that watered the crops, tilled the land and planted the seed, and helped them live a life of luxury. But then the spy drones came, and the government set their sights upon it. So one night, they snatched it away. There in the testing room, the Axis pulsed and glowed, clearly angry at whatever had been done to it. Normally, as the family had reported, this strange object did nothing like show its emotions. This was a start. Shooting stars and strange flying objects were seen in the sky a few days later. By then, the President of the United States had declared a state of emergency, putting the Axis in maximum security storage. But one day, The Grand Xenoph, a powerful being from somewhere never documented, broke in. Sensing the power of the new person, the Axis shattered in a blinding glow, wiping the entire city of Washington, DC off the map. The whereabouts of this alien being is unknown. He could vaporize anyone with a wave of a hand. Here is an actual witness account…” I read. We spent until morning reading it, until it cut off with a trail of scribbles. Something had happened to the author.", "However, on the next page, a different type of handwriting appeared, continuing the story.", "“This pyramid floating in the sky had a secret entrance, which I built. Continue with the map on the next page,\" I gasped, exhausted by the hours of reading beforehand. I slipped the map into my pocket and slunk back to my room. Processing such a long text is exhausting, after all. Myke snagged a Percy Jackson book and went down with me.", "As I walked down, I suddenly saw another book. It had a lock and a gnarly chain that looked as if it was made with an elder vine.", "“Hey Myke? Do you know any key or something?” I asked, scanning the room.", "“No, but maybe the Axis piece might be the key!” Myke suggested.", "After rolling my eyes to the point where I could see beyond my eyelids, I retorted, “Myke, that’s a stupid idea, there’s no way that-”", "Mid-sentence, the jewel suddenly came out through my chest, and morphed into a key.", "“Oh my, the Axis piece is the key,\" I mused, exhausted by the sudden drain of power.", "I put the key into the lock, and turned it. A loud click echoed throughout the room, and the chain fell with a loud clink. I opened the book, and a page read, as follows.", "<em>The complete Axis is long gone. No one knows how many pieces it was split into. But I know. There are 37 pieces.<\/em>", "“37?!?” I shouted, frustrated. The voice inside my head responded: <em>Yes. There are. Keep calm, or else that will waste your power even more.<\/em>", "I muttered some words that only The Grand Xenoph would approve of under my breath.", "“Fine,” I grumbled to the voice.", "“Are you delusional?” Myke questioned as he looked peculiarly glared at me.", "“Nah,” I denied. “Anyways, ‘there are two Master Pieces: The Gem and The Eye.’”", "<em>That’s me!<\/em>", "<em>What do you mean, “that’s me?”<\/em> I thought to myself.", "<em>I am the Gem,<\/em> the piece explained. <em>Someone else has the Eye. But it is not The Grand Xenoph. The Grand Xenoph has the Star, a powerful piece, but not as powerful as me.<\/em>", "<em>Who is it then?<\/em> I whispered to the piece.", "<em>We will never know.<\/em>"], "tall": false}, {"id": "chapter-15", "n": "15", "label": "Chapter 15", "title": "Report", "img": "16.jpg", "paras": ["I trotted down the attic stairs with Myke to report my findings. I held up the book with the lock up to Kreigh’s face. Astonished, he looked at us with a look of disbelief.", "“How did you unlock it?” he inquired.", "“My Axis Piece helped me,” I replied", "“Ah, no wonder. This pyramid can do it too, but it gets jammed frequently.”", "“No, mine works perfectly fine. My Piece told me some good information.”", "“Good. What is it?” Kreigh questioned, eyes ablaze.", "<em>Don’t,<\/em> my piece answered.", "“Why?” I muttered to myself.", "“Kreigh, he’s being delusional again!” Myke chimed in, pointing to me.", "<em>Oh shoot, I’ve been compromised,<\/em> the piece grumbled.", "<em>Don’t be such a grouch, Gem. What harm could a little piece of useful information do?<\/em>", "<em>Oh, I don’t like being discovered. You know well enough,<\/em> the Gem replied begrudgingly.", "“Anyways, there are 37 Axis Pieces, with 2 Master Pieces out of them all. The two Master Pieces are The Eye and The Gem. I have The Gem.”", "Kreigh looked shocked, but nodded. “And where is the Eye?”", "“We don’t know,” I admitted.", "“Oh well,” Kreigh sighed.", "“So, we have to find the Eye before The Grand Xenoph,” I added hastily.", "“We found something too,” announced Win.", "“Since when were you here? You have a habit of sneaking up on people, don’t you know?” I scoffed.", "“Uh, my bad,” he stammered. “We found out where the Hooded Devil leaves the Haven secretly. Or, as now we know, Miss Eliza. So, we could enter through the same route.”", "“Anyways, I’m sending you all on an investigative mission into the Haven. This is very high-stakes. One failure could force us to lose our best operatives in the field. Pack your weapons. We will embark on this exploration tomorrow night. Pick up a set of disguises from the tailor in the morning. And get a good night’s sleep. We’ll talk plans later,” announced Kreigh.", "“Another thing about the Axis pieces,” Win continued. “The minor pieces resemble everyday items. It could be anything, from a gold bar to a locket to a boot. It could even be your underwear if you’re very unlucky.”", "“Of course nothing can ever be easy!” I groaned.", "We all walked back to our rooms, probably to prepare for the tough night ahead. But no, I did so and immediately plopped back into my bed after a long, hot shower. Drifting into sleep, I had a lengthy chat with my Axis Piece, and proceeded to step into a strange dream. Before me, I saw a young Illuminati member. He didn’t look like anything, but his left eye seemed a bit off. It seemed to be a translucent white, radiating a special power that enticed me to step forward. I stepped forward to touch him. <em>Is this the owner of The Eye?<\/em> My hand passed straight through, his image fading into a mere shadow. I felt a tug at my heart, like the Axis Piece trying to pull free. I heard laughter behind me. The scene shifted. In the dark Haven halls, this mysterious member seemed to be teased at by all the others for this apparent defect. Then alone in the corner he sat, scribbling away at his little notepad, probably fantasizing about and drawing situations he’d rather be in than deal with this endless torture. Then the scene shifted yet again, showing another young person, looking slightly different from one before, bearing this strange white eye and commanding all the Illuminati forces. But then I felt I was falling away through darkness. Through an infinite hole in the ground. I woke up from this prophetic vision immediately, startled at this sheer realism. But I then just shook it off and checked the clock: I’d slept until afternoon. I wasn’t the slightest bit hungry though, since we denizens of the Republic are very accustomed to hunger. Now, the Base was bustling with activity, commands being shouted here and there. The team was waiting for me at the tailor’s shop.", "“Nyk, you’re late!” Kreigh roared.", "I could only reply, “Sorry.”", "“We’ve been waiting for you,” Win complained, “For one whole hour now! You sleepyhead!”", "“Who you calling sleepyhead? Yesterday you slept for even longer than me!”", "“Well, that was just because you beat me up the day before! You can’t be talking!”", "“Also, one hour is not that much! You didn’t have to wait for me!”", "“You two, stop bickering!” Kreigh yelled over the chaos. Everyone in the area stopped, frozen in their tracks, staring at us. Embarrassed, we shut up and looked to Kreigh.", "“Understandable…” Myke sighed. He snuck over to one of the bins with the disguises and started subtly picking it up and taking it.", "“Hey! No touching!” Kreigh snapped.", "Myke immediately shot his hands in the air. But the bin was already off the rack. It clattered to the floor, clothes spilling everywhere.", "“Oh shoot,” I scoffed, “Now we need to clean this up! Look what you’ve done, Myke!”", "“My bad!” he feebly defended. “...But can I keep these boxer shorts?”", "I groaned. “Fine! Keep that 1000 year old underwear But keep it at least a hundred thirty-seven feet away from me!”", "“I’ll wash it! Geez!”", "“Fine! But still, keep it at least ten yards away from me now!”", "“That’s still thirty feet!”", "“You two, what did I tell you half a minute ago?!?” Kreigh fumed.", "“Welp, let's go to the place that the Hooded Devil goes through,” Myke shrugged.", "“Not so fast! We still need to don our disguises!” I grabbed Myke, whirling him around. We all hurried to our rooms to change, as Kreigh dismissed us, clutching our disguises tightly in our hands.", "Eventually, we came out. Myke was dressed up as an old man, while Kreigh donned red hair and a long beard. Win wore beggar clothes, and I had a crutch and wore an ugly mask to make me seem sick. The Gem helped create illusions that made our disguises more realistic.", "“Alright, let’s go!”"], "tall": false}, {"id": "chapter-16", "n": "16", "label": "Chapter 16", "title": "Mission", "img": "17.jpg", "paras": ["We walked past what used to be the World Trade Center. Now, it was another monument to The Grand Xenoph. It made me sick to my stomach, how The Grand Xenoph forced humanity to worship him. Suddenly, I noticed the Hooded Devil somersault next to me, and took off her mask, showing Eliza’s face to be bruised and tired.", "“Troopers are coming! There were too many of them. They chased me to the World Trade Center. We have to hide!” We rushed through the spinning doors. I wondered why they would be sending so many Troopers, before I remembered that Eliza was the Hooded Devil, scourge of the Illuminati. Of course they would send Troopers after her! But this many? Something was wrong…", "We hid behind a few chairs. I held up RAD, charging an air spell.", "“Nyk,” Myke spoke cautiously. “What is that air-ow for?”", "I smiled. Myke was not going to like this. I fired it at the ground, launching us up really high.", "“Ahhh!!!!” Myke screamed. I forgot to tell you, But Myke is afraid of heights, unless he’s in a plane or ship. He hates falling. And we were falling straight for the top of the One World Trade Center. At the last second, I used an air-row(and yes, that IS what I’m calling it) to slow the fall, and we rolled onto a somewhat intact balcony. It creaked underneath our feet, threatening to fall off. I could see the entirety of New Hell. But, it was not like the old magazines. I saw the Haven in the distance, where the Empire State used to be. I narrowed my eyes. The ruined Statue of Liberty, which used to be a beacon for freedom and hope, was not supposed to be a statue in The Grand Xenoph’s honor. It used to be a mere second scrapyard, after being completely obliterated by The Grand Xenoph. The One World Trade Center used to stand tall in the sky. Now, it was leaning over at a dangerous angle. But then an Illuminati airship spotted us, and rammed into the building just a floor or two below us. The tower groaned from the added force, foundations giving way and the tower slowly began its descent to doom. I had heard of a 21st-century crisis with two towers in the area collapsing. This could be mildly comparable. We saw the airship below us, and I shot a few arrows that were dripping yellow liquid at a sparking patch. Clearly, this airship had a defect. The liquid exploded in a green blast, putting a dent in the roof with a crack just wide enough for both of us to slip through.", "We jumped down to be met with laser fire. I got hit several times, and the Illuminati members forced me down, making me kneel. But I wouldn’t submit to them. I picked up my crutch and knocked out their legs from underneath their bodies, feeling them hit the floor. I then grabbed them and pushed them out of the hole in the roof, sealing the opening with an icy blast of an ice arrow. I pulled out an intercom unit.", "“Kreigh, Do you copy? We’ve hijacked an airship, we’re on our way,\" I shouted into the mouthpiece.", "“Copy that. We’re inside already. The Republic put up a new The Grand Xenoph statue where the Statue of Liberty once stood. You saw it?” Kreigh replied.", "“Yes, We saw. Now, I'm on track to ram into the capstone,\" I pulled the throttle, the airship accelerating quickly towards its target. I spread yellow liquid on the floor, setting a timed electric pulse to run in a minute, or at collision. I pressed the wire to the liquid, sealing it tight. Myke and I clambered up to the roof, thawing the ice that blocked the exit. We were about to hit the Haven. I calmly put away our weapons and grabbed our packs. Myke was pacing around in fear. But we had to. Just this once.", "And so I grabbed Myke’s hand, and pulled him off the edge."], "tall": false}, {"id": "chapter-17", "n": "17", "label": "Chapter 17", "title": "Espionage", "img": "18.jpg", "paras": ["“Have you gone insane!?” screamed Myke as we were tumbling off the airship.", "“What do you mean?!?” I shouted over the whoosh of the wind. “We’re gonna be fine!”", "“NO WE WON’T!!!” Myke cried. I flipped midair and aimed an electric arrow at the capstone, and it turned purple with Gem power. I fired the arrow, but we were travelling too slow. It created a sparking platform below, and we tumbled on it, landing with a thud. The platform only sank a few feet, not the several yards downwards we needed to go. I shot a fire and yellow liquid arrow together, and it ignited an explosion when they hit. We jumped down through the hole. We were in.", "Myke, however, wasn’t very happy.", "“Next time you are on a mission,” Myke declared. “Leave me out,\" Eliza stood up.", "“This isn’t the throne room, Nyk…” she murmured with a frown on her face. “We didn’t have enough energy to launch into the capstone,\" I looked around, and realized she was right. We needed to traverse through the Haven in order to reach the throne room. I groaned. <em>Why couldn’t things ever be easy?<\/em> I looked around, wondering which way to go, before I realized I had Eliza. Stupid me.", "“So…Eliza. Which way to the throne room?” I requested. Eliza pulled down her hood and took off her mask.", "“I think we should head eastward, although I haven’t been to this part of the Haven yet. It seems ruined, yet…industrial?”", "“I think it’s some sort of factory…” Kreigh whispered in awe. Suddenly, we heard loud thumping, like a group of robots. Peering through a crack in a partition wall, we gasped in surprise as we saw the Troopers, marching single file. But these were different. They were robotic, muscular yet slim, with an underlying green glow. Their triangular faces had a screen projecting an eye. Their arm had a cannon attached on one arm, and a chainsaw on the other. They had jetpacks attached to their backs, and their feet were slim and strong. We quickly hid before they could locate us. Eliza put on her mask and hood to hide her identity.", "Suddenly, a boom echoed through the chamber. <em>That must be the airship. Seems like it did explode.<\/em> The robots turned, their feet glowing. They suddenly blitzed out of the room, leaving green afterimages. I gulped. These robots seemed powerful. I snuck near a door, and pulled it open slowly, with a soft creak. In the turn of a dime, the Troopers II turned and saw us, and immediately started shooting green projectiles. When I thought we were doomed, Myke’s underpants started to glow. I wish I was making this up. The 1000 year-old underpants were going to be our savior. It was an Axis Piece. The robots shut down, and the Piece warped away along with Myke.", "“Myke!” I yelled concernedly. I looked around, and to my relief, I heard Myke behind a wall.", "“Uh, Nyk? Why’s the air so musty? How did I teleport?!?” Thankfully, the Axis reaction wasn’t powerful enough to send Myke to the Sahara Desert. I aimed RAD and fired the arrow, knocking the wall down. Kreigh and Eliza’s mouths were open the entire time.", "“Uh…what?” Eliza whirled around in confusion.", "“Did that underwear…was that…?” Kreigh stuttered.", "“Whatever,” I shrugged. “At least we have another Axis Piece. Let’s keep moving.” We walked through the factory, avoiding Trooper IIs and Myke warping randomly. Eventually, we found the exit. Suddenly, a big thump sounded, and a shadow loomed over us. We slowly turned around, and saw a giant Trooper II, aiming its large cannon. Myke teleported into its arms, and was put in a chest cavity.", "“Help!” he cried. I turned and saw the cannon fire a huge laser. I dodged, and felt the air next to me heat up. As the beam collided with the ground, a fiery explosion launched rocks at us. Eliza used her sword to slice one in half. I aimed an air-row and hit a rock, launching it back at the large robot. Kreigh slowed down the rocks with his Axis piece, and dodged them easily. The robot punched a wall, which caused the room to start crumbling. Eliza dodged some falling rocks, and used them as platforms to reach the robot’s chest. She pulled her sword back, and it glowed with orange energy. She stabbed in the crevice in the chest cavity and used it as a lever to try prying it open. Kreigh jumped up, using the Axis Piece to propel himself up to Eliza to help her. I used my air-rows to launch upwards, and grab its finger. I climbed up the hand, and it tried swatting me. However, Eliza jumped off the chest and grabbed me, pushing me away from the hand onto the shoulder. The robot tried swatting Eliza, and I looked in horror. To my relief, however, Eliza jumped off the robot onto the wall, and jumped back, using her sword’s energy to spin into the chest cavity, busting it open.", "Myke jumped out with the power source in his hand, a hovering, glowing orange flame.", "“What the celestial blazes?!” I exclaimed.", "“Excuse me, but I think you actually got the name of the thing right,” Eliza replied.", "“So that is a celestial blaze? And how is Myke literally holding it right now?” I questioned.", "“Celestial blazes aren’t your typical flame. They don’t go out, rarely burn objects, survive without fuel, hover in the air, and are really powerful,” Eliza explained, “as long as you know how to unleash their hidden potential.”", "“How do you do it then?”", "“I don’t know. All I know is that recently, the Haven scientists were running an experiment on this matter and apparently they finally succeeded.”", "“Oh well. Let’s move on.”", "“Stay careful! There still could be more around!”", "“Oh we’ll be fine. Their Artificial Stupidity could not process anything in front of them with any other action than ‘Put in Chest Cavity!’” I laughed. We continued the trek across the sprawling floors of the Haven. We could finally wreak havoc on our adversary’s domain."], "tall": false}, {"id": "chapter-18", "n": "18", "label": "Chapter 18", "title": "Demolition", "img": "19.jpg", "paras": ["We swiftly glided across the Haven floor, shoes making no sound at all. It reminded me of the big hall in the Rebel Base used for parties. Shaking off the thought of anything similar between the warm, welcoming second home and dark enemy sanctum, I pushed ahead.", "Suddenly, we met a whole new squadron of Trooper IIs. I threw a grenade at them, hoping it would deter them for the slightest second, but the effect was surprising.", "“Stop! Intruders!” the leader screamed. Then it looked down, seeing a grenade rolling at its feet. “Ooh, new object detected! Will bring to my master!” the leader chimed, placing it in its chest cavity. That caused the Trooper II to completely bug out, exploding, shrapnel and large pieces of metal flying everywhere.We threw a barrage of grenades, and the Trooper IIs kept putting them in their chest cavities and exploding.", "Soon, there was a thick layer of Celestial Blazes covering the floor, their orange lights illuminating the hallway.", "“Creepy,” Myke shivered. That was a bad idea. The underpants lit up again and made Myke teleport to a scrap of metal poking out of the wall past the field of Blazes. And guess what it did? It gave Myke a wedgie. Like an enormous one. He hung from it by his underpants, screaming for us to set him free. The Celestial Blazes in the trail of the teleportation turned blue, sparking with energy. Eliza stooped down to place one in a vial.", "“Wow, so this is how you supercharge one of these Blazes! An Axis Piece!” Eliza squealed with delight.", "“These may come in use later,” I mused, bending down to collect both the blue ones and orange ones with separate jars. Humming with energy, the jars seemed to vibrate in my hand. I could bear no more, so I capped the jars then shoved them in my back pockets. I then raced over to Myke and freed him of his painful and embarrassing prison. Though the Axis Piece could have freed Myke itself, it seemed to enjoy this strange ordeal, so it teleported again, right in front of a singular Trooper II down the hall. Myke tried throwing a grenade at it, but then teleported again past a wall before the grenade left his hand. I heard Myke scream, the thump of a grenade on a metal capsule, a unison of robotic “Intruder detected! Proceeding to destroy threat!” and the sound of Myke teleporting back to my side.", "“That was terrifying!” Myke shuddered. I went into the production room, got so scared that I misfired my grenade into the machine! All the Trooper IIs spotted me and chased after me, and here I am, back where I started!” Myke reaccounted.", "“YOU THREW A GRENADE INTO THE MACHINE?!?!?” Kreigh shouted, startled.", "“Uh y-y-es?” Myke stammered", "“Good job!” Kreigh exclaimed. Myke jumped back, surprised. Then, the expression on his face changed.", "“Oh, so it is a good job for destroying the machine that made the Trooper IIs. The grenade must have exploded in the machine already!” Myke concluded.", "“Don’t get cocky yet. We haven’t heard a—” I began.", "<em>BOOM!<\/em> The sound of the grenade exploding rang from the other side of the wall, followed by the sound of crashing metal and sputtering machinery. A hole was blasted into the wall, forcing us to dodge flying bricks.", "“See? I told you!” Myke grinned. I groaned in annoyance.", "Suddenly, the machine started shaking violently, and lights turned on everywhere in so many different colors. The ground started trembling, and everyone struggled to keep their footing.", "“What’s going on?” Kreigh panicked.", "As quick as the machine started, it stopped. And then, it opened a door, causing a monstrosity to come out. It had three heads. One on its shoulder, another on its waist, and a final one was on its right leg. Arm cannons circled around its chest, and a hulking mass of arms circled the rest of its body like the spikes of a sea urchin. One set of rotating dual blades poked up from its head, or was it its butt? It glowed with energy, probably having extra power sources inside, too. Trooper II heads were fused to some of its limbs, making perfect hammers to bash someone’s face in. It walked on four legs, each of which were made of normal legs fused together by a malfunctioning welder. It had no chest cavity that we knew of, and a glowing glass dome on the top flashed many colors before finally coming to a stop at a red eye with a vertical pupil. Gazing right at us."], "tall": false}, {"id": "chapter-19", "n": "19", "label": "Chapter 19", "title": "Monstrosity", "img": "20.jpg", "paras": ["“What on earth is that thing?” Myke trembled.", "“It’s powered by Axis piece energy!” Eliza responded while drawing out her sword.", "Suddenly, General Darkblade jumped on the back of the creature, laughing evilly.", "“Well, hello my friends,” he smirked. “When Myke damaged the machine, it combined every Trooper II part that was being made, and spat it out in a last ditch effort! And it worked! Behold, the Monstrosity of the Republic! Atlantix! ATTACK!” Atlantix roared with anger, and fired orange-green blasts, a combination of celestial blaze and Axis power. I glared at Myke for a split second, while he laughed sheepishly. Spikes shot out of its back as General Darkblade warped away. I fired an electric arrow, using the Gem to power it, but all it did was make Atlantix slow down, his body moving forward like a storm. Weren’t robots supposed to be weak to electricity? Kreigh lobbed blue projectiles from his staff, but a green shield surrounded the monstrosity of parts, and expanded in a pulse, knocking all of us off our feet. Eliza tried using her sword, but Atlantix flicked her aside. I rushed towards Eliza, and saw that her gauze fell off. The wound on her ankle re-opened. Kreigh and I helped pick her up and we started to run.", "“What do we do?” Eliza groaned. “Our attacks aren’t doing anything!”", "Myke’s pants started to glow a familiar red, and the glow spread across his entire body. His legs churned as he ran really fast, opening paths for the rest of us to go through. Atlantix fired a green blast, but Kreigh enveloped us in a shield. I used the Gem to propel us forwards and out of the side of the Haven, taking Myke with us. Atlantix jumped through the hole, breaking one of the walls of the Haven. He was too heavy to be supported by the Republic’s feeble jetpacks and hover boots, so he fell to the ground. But no, he didn’t crash onto the ground in a heap of scrap metal. He turned himself dual blade-side up, and used it as helicopter propellers to fly into the air to try to scout us out. Kreigh fired projectiles at the monster, while maintaining the shield, which with the Gem’s power, was basically an aircraft. Myke set Eliza down, and pulled out a first-aid kit, to fix up her ankle. Meanwhile, I fired air-rows at a steady rate to keep the glowing blue shield floating, while the Gem propelled it away from the monstrous monstrosity of an automaton. Atlantix was catching up, its jetpacks pointing backwards like airship booster rockets, and blasting forward with green energy. Kreigh’s attacks were doing nothing, so Eliza sat up, and channeled the orange energy in her sword into projectiles, fusing with Kreigh’s and I helped by using Gem energy. The Triple-Powered Blast knocked into Atlantix, and slowed him down, revealing the jetpacks.", "“Guys!” Myke yelled. “I have an idea!”", "“What?” I screamed back.", "“We shoot at the jetpacks!” he answered.", "I fired at a jetpack, causing the robotic monster to slow down. I repeated this process, until finally, Atlantix only had his helicopter blades keeping him afloat. Noticing we were headed to the Atlantic Ocean, I timed my final blast to hit one of his swords, expecting him to plummet into the sea and become the Scrapyard 2.0. But no! The blades deflected my attack and Atlantix deftly caught the air-row, causing our bubble to fall down into the sea. Atlantix lowered down and wound up to throw a supercharged air-row to knock us out of the sky. I countered by supercharging one of my own air-rows using the Gem.", "<em>And now<\/em>, the voice in my head whispered, <em>We strike<\/em>. I fired the powerful arrow, and it cut through Atlantix’s arrow like butter. The Gem powered the arrow so well, that when it shot through the air, a sonic boom cut through the atmosphere. Buildings crumbled on land. The arrow pierced through Atlantix's chest, causing him to fall down to the sea, his body starting to crumble. Its legs, arms and countless more body parts disconnected, the sparking body parts fell from the lump of metal that I assume was the torso. To finish the job, I shot all four types of arrows I carried at once. The arrows hit home, despite being very damaged and supposedly unable to fly well. They stuck into four corners where limbs should have gone, and firmly planted themselves in. As he crashed into the water, we saw him glow green for one last time before flickering and sinking to the seafloor. Suddenly, our blue dome trembled, and we started to fall. Kreigh’s forehead was beaded with sweat from trying to maintain the shield, but it just disappeared. A wave crashed into us, and everything went dark."], "tall": false}, {"id": "chapter-20", "n": "20", "label": "Chapter 20", "title": "Trapped", "img": "21.jpg", "paras": ["When I woke up, I found myself in glowing green chains in a pure white room. I looked around, and my friends were nowhere to be seen. A familiar figure then strutted into the room.", "“Well, well, well. Who do we have here? Ah, Nyk Valios. Best fighter in the whole of the Rebellion.” General Darkblade boasted, his smile getting more devilish. “Captured so feebly? Washed up on the beach? We were lucky to find you, and the rest of your company too. Don’t worry, they’ll be fine. We shall squash your Rebellion once and for all! So I’m offering you one last chance. Join the Republic, and swear loyalty to The Grand Xenoph! OR ELSE!”", "It was then I realized that he had taken my disguise off. Well, it couldn’t be helped, so I decided to fire back with insults. The only path was death, I supposed.", "“Never! You dogs, you good-for-nothing scum! Why should I serve you when you’ve been terrorizing denizens for so long?” I scoffed.", "“Very well. I apologize for what happens next,” General Darkblade apologetically muttered with the same coldness in his eyes that we were told about. He walked out of the room, and the lights turned off. In the gloom, I could see a strange green translucent liquid sloshing out from the sides of the room. In a few seconds, it was up to my ankles. My shoes were soaked, but I didn’t care. I had been in enough smelly scenarios to know that for this kind of scenario, I couldn’t care less. I closed my eyes and tried to ignore it, but it quickly rose up to my waist. Then to my neck. I couldn’t move. The liquid emitted a strange smell. <em>Toxic waste! Of course they would use this!<\/em> I shuddered at my imminent death. <em>I, Nyk Valios, dying of being drowned in toxic waste? Of hypothermia in this cold liquid?<\/em> I struggled against my chains and the thick liquid, struggling to break free. I gulped in air before the liquid gushed up to my nose. Restrained by my chains, I could only helplessly struggle while the liquid submerged me completely, holding my breath for as long as it would last me. My lungs felt like they were on fire. My eyes were shut, and I flailed helplessly. The Gem’s energy surged through me, but I felt myself wilt like a flower. I felt a thud upon my head after a muffled sound of a blast, and everything went dark", "I didn’t know how long I had been out for, but it seemed like only thirty seconds. I looked around. A hole into the room I came from was in the middle of the floor. Around me were Eliza, Kreigh, and Nyk. Of course, since Win had so often swam out into the middle of the Atlantic Ocean at times to try evading the Republic, like last time when he succeeded but was burnt by an underwater volcanic eruption in the Mid-Atlantic Ridge. He still hasn’t recovered from that burn yet. He probably swam back to Base to tell the others to be martyrs for no obvious reason at all.", "“Good, you’re awake,” Kreigh sighed.", "“Oh geez, you look monstrous!” Eliza complained. She held up a tiny makeup mirror. When I looked into it, I was so scared that I almost blacked out for a second time.", "Green goop covered my whole entire face, my clothes, and my shoes. The liquid seeped in so well that I was completely covered, without even a square millimeter of skin sticking out anywhere. I looked like a slime monster. No, not even. A zombie. A weird alien of some other species than The Grand Xenoph himself. We quickly ran through the halls, passing many Troopers and probably giving them all heart attacks. We quickly found the shower room, knocked out all the others in the room, and locked the door. There, I showered well, getting every single ounce of green goopy toxic waste off my clothes and body. To be honest, it wasn’t so hard. It came off quickly, like washing away airship grease with a power washer, but I still felt the dirtiness of Haven scum on my skin. After I had a nice wash, we walked back outside, not bothering to dry off somehow. I was feeling very refreshed, but my mood was quickly soured by someone. Guess who? Ivan Damazcus, yet again, staring us down from the end of the hall."], "tall": false}, {"id": "chapter-21", "n": "21", "label": "Chapter 21", "title": "Prison", "img": "22.jpg", "paras": ["“Well, well, well.” Ivan chuckled. “You bunch are tougher than I thought. That toxic waste should have ended you. And you.” His head swiveled to Eliza. He leapt up and punched Eliza, sending her flying. She groaned in pain, and Ivan looked shocked. Then, he was filled with rage. <em>He heard Eliza’s voice<\/em>.", "“Eliza!” Ivan growled as Eliza struggled to get up. “I never knew my own daughter would be a traitor to the Republic.” Green lightning shot out of his pads, striking Eliza in the stomach. As quick as a diving falcon, talons opened, malice in his unseeing eyes, he punched Eliza yet again, treating her like nothing more than prey.", "Eliza staggered as she struggled to get up. “Dad, how could you?” she whined.", "“My devotion to The Grand Xenoph will always be greater than my love for my daughter,\" he replied coldly.", "We all stared at him, open-mouthed with shock.", "“Please don’t take us to Grandpa…” Eliza whimpered.", "“Yes, I’m taking you to Grandpa to meet the worst fate any one of us could meet! No, I shall ground you first for you to rethink your life decisions! Now, Eliza, go back to your room!” Ivan roared.", "“Oh boy. I’m definitely not going to like this even one bit,” Eliza muttered.", "Everyone knew what that meant. For Eliza and Reuben, The Grand Xenoph was their grandfather. And for everyone else part of the Illuminati, their father. Though The Grand Xenoph somehow had a soft spot for Eliza, she was definitely not going to make it out alive.", "Eliza reluctantly walked back to the residential area of the Haven, shoulders sagging. Coughing up blood, she turned her head towards us and managed a few last words to us: “Sorry I couldn’t go with you all to the end. See you in heaven. Or in hell. It doesn’t matter, because I’m done for.”", "I knew, deep inside, that this was the end. The last time we’d ever see her. Because even though she got special treatment before doesn’t mean she’ll be safe from The Grand Xenoph’s wrath.", "“Good luck dealing with your stinky, grouchy old grandfather,” I whispered to her. But by then, she was long gone.", "“Let them go,” Ivan commanded the Troopers, and they started to escort us out the way we came from, which was the hole in the wall. I thought we were actually going to be let go by The Grand Xenoph and his forces, because they were afraid of us. I knew very well that this could be a trap, but I took my time and soaked in all of the moment. I knew they were going to throw us in prison, but I didn’t know how. Maybe they would throw us in there the old-fashioned way. Maybe they got us into some torture device that took us there. I couldn’t make a move, to hit all the Troopers in one go and run away, because Ivan was still keeping a close eye on us, and would definitely kill us if we messed with his soldiers.", "When I least expected it, I heard the almost soundless whir of hover boots, followed by a robotic arm that clamped down hard on my shoulder, then tossed us all into a massive vent. We bumped into each other and the sides on the way down, the sound of banging on metal echoing through the tunnel. When we reached the end, we were all pretty bumped and bruised, falling in a heap on the cold floor. I looked around, rubbing my head, seeing that we were in a jail cell.", "Immediately, Trooper IIs came in and took away all our weapons, leaving us virtually defenseless. They put them in a bucket on the opposite side of the bars and swung the door shut with a mighty clang. The sound must have triggered Myke’s underwear, causing it to glow red and charge up to teleport. Before we could stop him, he zipped to the hall in between the cells, and grabbed our weapons, but had no way to get back. I facepalmed. It just so happened that for some reason, Haven cells used two layers of bars. A single Phoenix Talon Grab could not seal the deal. But that’s when I found a perfect solution to our dilemma.", "“Stand back, everyone,” I warned.", "“What are you gonna do? Ram into the bars with your skinny build?” Myke taunted.", "“This also means you, Myke. Get back or get seriously hurt.”", "“Oh come on, you can’t do much with what you have now!”", "“I said STAND BACK!” I yelled, so loud that the vent cover rattled.", "Myke, too scared for words, reluctantly slunk away, not knowing the serious damage I could cause. Crossing my hands and bringing them back to my waist, I lunged forwards, yanking the bars as hard as I could. It came apart in the middle, not how I wanted it to be. Mustering up the strength to do so again, I tried again. It broke as well.", "“This is going to take us a while,” Kreigh groaned.", "<hr>"], "tall": false}, {"id": "chapter-22", "n": "22", "label": "Chapter 22", "title": "Escape", "img": "23.jpg", "paras": ["I rolled over and woke Myke up in the middle of the night. The sky was dark outside the window, and the only light was from the moon, shrouded by the clouds of smog from The Grand Xenoph’s factories. Kreigh was sound asleep, snoring a loud snore that sounded like an airship passing directly a few feet above you in the air. Everyone else in the prison was asleep except for the night guards, who didn’t notice our few broken bars. We made good progress during the day, taunting the guards to have them go away, and snapping a few more bars with them gone. They were very easily angered, being ignorant and raised by the Republic as both spoiled brats and mere servants with narcissistic tendencies, being put on prison duty for probably showing insubordination to The Grand Xenoph. But one thing was for sure, they lived to tell the tale and still haven’t learned their lesson.", "“Ugh…Santa Claus?” Myke murmured sleepily.", "“Idiot!” I hissed back. “It’s me! And besides, Santa Claus wants you asleep!”", "“Oh, yeah!” Myke grinned. His expression changed to one of questioning. “So…why’d you wake me up?”", "“So we can free Eliza,” I answered simply. “We’re in the Haven prison after all.”", "Myke slowly turned his head to look at the guards, who thankfully hadn't noticed us. Myke turned back, whispering, “And how do you plan on doing that with these doofuses guarding us?”", "“Uhhh, Myke? The guards are watching us!” I whispered into his ear, “I think you said that a bit too loud!”", "“Oops, my bad,” Myke apologized, but quickly turned to criticize the guards out loud. “Hey all you narcissistic dunderheads! You bumbling buffoons! You disloyal servants to The Grand Xenoph! What are you doing here! Go jump out of the Haven instead! Yeah, like go splat on the pavement!”", "One of the guards got extremely furious and yelled back, “You? Insulting me?!” He was seething with rage from being taunted on the afternoon shift, and that probably just got even angrier. Fuming, he and the other guards thundered out of the room.", "We took our sweet time, breaking bars. Finally, I got the outcome that I wanted. A bar snapped right out of its place, intact, able to be swung around like a weapon. I took this as a good opportunity, swinging it around like a madman, supercharging it with Gem power. The end gradually gained a heavy ball of metal from melding together with all the banging, and picked up a few shards from the floor, giving it a mace-like appearance. The Gem did the rest, smoothing out and sharpening edges to make it a true mace, a weapon of mass destruction.", "Kreigh, who just minutes ago was snoring soundly on his cot, sat up, startled at the chaos we were causing. The bars were breached, and the guards weren’t coming back in a while. Without a word, we grabbed our other weapons and headed down the hall.", "“So, what are you going to name this weapon now?” Myke inquired, now fully awake and aware.", "“I’m going to name this The Jailbreaker, seeing how this little fella got us out of prison,” I replied.", "“Remember when I remarked that you sucked at naming things? I take that back. This is a truly amazing name!” Myke exclaimed.", "When we got to the locked door, I swung The Jailbreaker. The heavy weapon bashed the door apart like punching a crumbly ration-pack cracker, and we continued our journey. We walked through the silent halls, clobbering the occasional Trooper II as they hovered around on their patrols. We were quick and stealthy like assassins, leaving no trace and no sound. Getting close to the residential areas, we heard a lot of chatter, especially the guards that we faced earlier in the prison. The end was in sight. We were about to complete our mission."], "tall": false}, {"id": "chapter-23", "n": "23", "label": "Chapter 23", "title": "Rescue", "img": "24.jpg", "paras": ["Carrying a hundred pound pure compacted iron mace is not easy. Especially when navigating a maze-like place like the Haven, which has winding long passages and is not known for walkability. I had never carried that much weight in my whole life. Some people who were really strong could lift a giant chunk of metal that would have gotten them rations for life! But I was weak. I could only gather a few pounds of rations before my arms gave in. I had trained for quite a while in the rebel base, but even with that strength, carrying all this load was really hard. Shoulders carrying both the weight of my weapon and the weight of the world, that the whole human race was depending on this mission, we plodded along. Finally, we came to the elite bedrooms. I noticed Ivan's door was open, showing all the grand spoils of war and luxury goods inside. A broken balance scale lay on the floor, fragmented. I also noticed that light was shining from inside the keyhole of Prince Reuben’s room. Yes, the guy I met in Rehab, whom I punched in the face. Peering through the keyhole, I saw Ivan in there, spanking Reuben.", "“Dad, why would you not even tolerate any constructive criticism towards Grandpa?” Reuben pleaded.", "“I will not try to stop my father’s holy regime!” Ivan scolded, landing blows between each word. Releasing his son, Ivan turned around and stormed out of the room, leaving Reuben howling in pain. We hid in the huge laundry bin, and Ivan didn’t even raise an eyebrow at us. We were tense until Ivan walked into his room and locked the door, turning off the light. We all let out a sigh of relief as we climbed out of the laundry bin, and made our way to Eliza’s room. There was a combination lock on the door, probably put there by Ivan to prevent his daughter from getting out. The door also shook as if someone was pounding on it. I scanned the hall, looking for any sign of the passcode. Surely Ivan would have written it down for ease of reference. Suddenly, Myke’s underwear started to glow again. I groaned. How many times was this undercover Axis Piece going to get us into trouble? He teleported, and the sound of Ivan’s angry shouts followed. He then teleported back into the laundry bin with us, as we spied an angry Ivan looking into the hall and cursing. Slamming the door, he turned off the light again and went back to sleep.", "After fifteen minutes or so, the entire Haven was still. No guards, no troopers. Even the Trooper IIs marched back to their charging ports to gear up for the day ahead. We crept out into the halls, walking slowly. I summoned the Gem, morphing it into a key. Since the Gem could shapeshift into any size or shape, I presumed, so I thought it could be used as a skeleton. Inserting the Gem into the keyhole, I waited a while for it to get used to and calculate the shape and size needed to unlock the door and mold into it. The door unlocked silently, and we tiptoed inside. Ivan was laying on his bed, snoring already. <em>Guess like being the leader of the Illuminati makes you very exhausted, just look at you there, snoring soundly. Well, here’s a little wrench in your plans!<\/em> I commanded the Gem to stop glowing, and pried a very sticky adhesive paper off his desk. Not knowing what it was, I started towards the door. Looking to my side, I saw Ivan turning in his sleep just a few feet away from me.", "“Thank you, Father. I hope I can help you forever, with all matters, not just with the forces. Thank you for the promotion,” Ivan mumbled, probably dreaming of getting a promotion to be The Grand Xenoph’s right hand man, just like how General Darkblade did.", "Daring to get more information, I then took all the papers from his desk, soundlessly carrying them outside. Locking the door, we hurried to Eliza’s door.", "In the dark hallway, I pulled out the Gem and used it to illuminate the tiny note. The word ‘star’ was written on it, and Myke inputted the letters onto the combination lock. Kreigh tensed up, fearing that this would trigger the alarm system, but nothing happened. The lock came off with a soft click, and Kreigh caught it before it fell on the floor, a surprised expression on his face.", "Immediately, the door swung open and Eliza stepped out, sweating.", "“Dad got the supercharged blaze and questioned me about it. Then he trapped me and locked the door,” she mumbled, “Now, let’s get the hell out of here.”", "Kreigh took out Gnarn’s staff, with The Pyramid on top. Drawing a spiral and enclosing it with a square, he created a portal big enough for us to jump through. The four of us stepped in single-file, leaving nothing behind except for both the padlock and a loud boom of the portal closing that probably would have sent the whole Haven scrambling."], "tall": false}, {"id": "chapter-24", "n": "24", "label": "Chapter 24", "title": "Dreams", "img": "25.jpg", "paras": ["Of course, after hiding in all that pile of laundry, the whole team was very stinky. We needed a shower, and fast. I could even smell Myke from the other side of the grand hall, which was about thirty feet across. So of course, that was the first thing we did: Rush to the shower.", "Getting into one of the elite shower rooms, I walked into a stall. These elite shower rooms were completely closed, giving maximum privacy. You could do whatever you want in here, and nobody would know. The floor was still slick from the last occupant who used this room, who indeed used plenty of shampoo and conditioner. Closing the door, I undressed and threw my clothes into the washing machine in the corner. Turning the water on hot, I let the water wash over me in a torrent. Unlike the regular shower rooms, these elite shower rooms had faucets that dumped extreme amounts of water over your head, so that every part of your body was washed clean. Using shampoo on my hair and conditioner on the rest of my body, I scrubbed vigorously, trying to get every single bit of laundry lint and dirty Haven scum off of me, and then let the water run around me. Turning off the water, I got into the hot tub and took a moment to enjoy a nice bubble bath, and then rinsed myself off and dried myself with a towel. By then, my clothes had been sitting there in the washing machine for ten minutes already, since these washing machines could be done with your clothes quickly, washed and dried. After dressing, I casually took a stroll back to my room to have a perfectly normal sleep. Usually my dreams would be about taking over the Haven, killing The Grand Xenoph, partying with my fellow rebels, among other things. My nightmares would be being brought back in front of The Grand Xenoph for torture, being forced to abandon the Rebellion, Atlantix rising out of the sea to get revenge, and the occasional corruption by the Gem that I sweared wouldn’t happen to me. But there was this dream I found disturbingly realistic, as if it were a prophecy.", "Laying down on my bed, I closed my eyes and prepared for my day ahead. Drifting into sleep, I found myself in a jail cell again. This time, instead of the usual guards, there was a mysterious hooded figure. When I broke through the bars. He stared at me with a white, all-seeing eye. I felt it probing my thoughts, my emotions. But suddenly, a purple wall rose up in my mind. <em>This must be the Gem’s doing.<\/em> The figure turned around and threw a punch, glowing with red energy. Attempting to overpower him and pull him into a wall, I tried a Phoenix Talon Grab. Energy coursed through the two of us, looping in ways that I thought would rip us into the fourth dimension. The connection between the two of us was eerie in a sense, like an invisible rope was pulling us together. I pulled away, trying to escape, and a great explosion knocked both of us to the ground. The two of us were just sitting there, on the ground, panting. A Rebel. An Illuminati. The Illuminati member pulled off his hood, and we were face to face. It was the young Illuminati Member, the possessor of The Eye. He had brown hair, and his eyes were gray. He wore the typical Illuminati robe, his hands barely peeking out.", "Finally, after a long, awkward silence between the two of us, he finally spoke.", "“Whoever you are, wherever you are, and on which side of this great war you are on all don’t matter. But you have what I desire most, and I will be coming for you. Just remember, my name is Reaper, and you will not be safe from me,” he half-growled, half-whispered, fading into shadows.", "The Gem stirred inside of me. It told me to keep calm, that this poor person was just being used as a puppet by his Axis Piece. It told me that this guy was disloyal enough to The Grand Xenoph that we could win him over onto our side. <em>I communicated with The Eye’s power-hungry self that was desperate to be reunited with me. I think he’ll be joining the Rebellion soon,<\/em> The Gem reported. This was good to know, seeing that The Gem and The Eye had a strange synergy that could be used for far more than if they were separate. But I soon snapped back to reality, waking up from my dream to a new fresh start to my day."], "tall": false}, {"id": "chapter-25", "n": "25", "label": "Chapter 25", "title": "Meeting", "img": "26.jpg", "paras": ["I rubbed my eyes, groggy from that long sleep. For some reason, I actually woke up on time. Crawling out of bed and dressing, I pondered the possible meaning of my prophetic dream. Maybe I actually communicated with that Illuminati member? I didn’t know. Taking the long morning trek to the cafeteria, I stopped often, deep in thought.", "Finally, I got there.", "I trudged towards the breakfast table, where Myke was standing on a chair avoiding a cockroach that Eliza gently bent over to pick up, with Kreigh’s head in his hands. I smirked at Myke, and sat down.", "“So…” I broke the silence. “What do we do now? We’re out of that place already. Don’t tell me that we’re going back there.”", "“Oh yes we are,” Kreigh boasted, even though he was obviously tired from a sleepless night.", "“What are you thinking, Kreigh? We just got back from a mission, and really need some rest! Why do we need to make another mad dash into the Haven?” Myke whined.", "“Get serious, Myke. We are undoubtedly the most experienced operatives there are with going into and raiding the Haven. Plus, Kreigh probably spent the whole night reviewing the documents I stole from Ivan’s desk. They are filled with good, rich information to predict the Republic’s moves. We have no choice but to go inside,” I explained in a Kreigh-like manner.", "“That’s right,” Kreigh added, “they are planning another invasion of the Base, so we need to disrupt them with chaos.”", "“And when is that, exactly?” I asked, raising my eyebrows.", "“Today.”", "“Okay, so then let’s go!”", "Racing back to our rooms, we gathered our weapons and equipment and returned with our arms full of them. Eliza with her daggers and blades, Myke with some random weapon he dug out from the training room closet that was some sort of axe with two sides, Win with some old half-broken wand, Kreigh with his late friend’s staff, and me with RAD and the Jailbreaker. Fearing that my shoulders would sag, Kreigh did a quick spell that made the Jailbreaker light as a feather to me but still as heavy and deadly to others, so it would not hamper our mobility. I tried swinging it around, and did so with deadly efficiency.", "Myke pulled away in fear, stammering, “Whoa, c-careful! That was a little too close!” Win moved his wand and blue sparks came, but suddenly, the wand projected an image of a cloud with a folder.", "“Cloud storage full?!” Win complained, “This wand is only from last year! How is there no cloud storage?”", "After deleting about 50 different useless spells, Win tried again, and formed a blue portal, and we climbed through.", "However, he had just downloaded the new spell and didn’t know how to use it, so we were sent to the outskirts of the city. Thankfully, the portal hadn’t closed yet, so we leapt back through right before it closed. After trial and error, we portaled straight into the Haven…", "right into General Darkblade's arms.", "“Gotcha.” He sneered, holding me and Kreigh into a headlock. I instinctively charged up my fist with Axis energy and punched, but General Darkblade effortlessly blocked.", "I stared at him, eyes wide with shock as he pulled an old boot and a charred piece of bread. They morphed into two ghostly orbs and they phased through his armor into his chest.", "“My turn,” he snarled as he knocked out the others. This, though, made it easy for me to squirm out of his grasp and grab Win’s wand. General Darkblade tried charging at me to also knock me unconscious, but I created a portal right in front of me. If my calculations were correct, he would get out further down the hall, creating a space that he couldn’t get to. Dragging everyone else, I created a portal to the base and pulled everyone through. But the fight was not over. The Illuminati would invade any moment now.", "As I was about to jump through, I suddenly felt a shock in my chest where the Gem was. I got pulled towards General Darkblade, holding his two Axis Pieces, or what seemed like them. However, this had a surprising side effect. Myke’s still prone form began to move, pants glowing like crazy.", "“Uh-oh,” I chimed, as Myke’s but gravitated towards General Darkblade’s face. The portal closed, and General Darkblade was left with a clear view of Myke’s rear end.", "“What the-?!” he cursed, not knowing that Myke had his Axis Undies.", "Myke’s butt collided with General Darkblade’s face, sending him crashing to the floor, both of them on the cold, hard ground in a heap. Myke, who just regained consciousness, looked around in confusion, before he noticed General Darkblade’s muffled screams. Thrashing around and trying to get the weight of a teenager off of his face, General Darkblade let go of his Axis Pieces, and they passed through the ground like they were ghosts. Their colors faded into gray as they touched the floor, revealing their true identities.", "<em>Those are the ghosts of the twin pieces Bread and Boot. They both can turn into spheres, but they prefer more mundane objects to turn into, like the bread and the boot. These ghosts are afterimages, showing where they have been. These ghosts have a tiny fraction of the pieces’ power, and each piece creates more ghosts that want to reunite themselves with any piece, thereby explaining the pull. We don’t know exactly where they are, but they’re in the vicinity. Keep your eyes peeled,<\/em> The Gem explained.", "However, tired from the battle, probably because spells on the wand drain energy, I collapsed and blacked out. And I had yet another strange dream. Here’s how it goes:", "<hr>", "The Illuminati member with a white eye, Reaper, strode into The Grand Xenoph’s room, carrying a plate with a slice of toast with jam. The toast was slightly browned, the way The Grand Xenoph liked it, but something was strange about the slice of bread it was made from. Kneeling down on one knee and bowing, he held his hands with the platter in front of him. The Grand Xenoph, legs crossed, took the platter with two hands and started to eat. But as soon as The Grand Xenoph bit down on it, he stopped. Something was stopping him from eating it. Trying again and again, he failed. Finally, giving up, he smacked the suspicious breakfast against the side of his throne. The jam came off, and the toast assumed a more curious form, a sphere, perfectly smooth. The Grand Xenoph put the sphere in his throne compartment, and he surged with power. He had gotten another Axis Piece.", "<hr>", "When I awoke, it must have been only a few minutes or so, because everyone was standing guard around me and General Darkblade was gone."], "tall": false}, {"id": "chapter-26", "n": "26", "label": "Chapter 26", "title": "Braces", "img": "27.jpg", "paras": ["Awakening with the new fact that we can actually magnetize Axis Pieces with Gem Energy, I whispered to the Gem to test it out. Channeling the energy, I wove it into coils, hoping it would work like an electromagnet. I was right– but I underestimated the power of my Axis Piece. From around the corner came a scream and a thunk of an Illuminati member falling to the ground. I blinked once, and nothing happened, but I felt a hot wind brush past my face. Whirling around, I saw the heel of an orange boot, as big as a building, in my face. Bracing for impact, I stumbled backwards, but it was already too late. The boot struck me squarely in the face, and I felt the coppery taste of blood in my mouth. On the bright side, the Boot was in a good mood today, and guess what it did? It morphed into some braces and secured itself on my teeth. Bands secured both sets in place.", "“Man, this chapter has horrendous pacing!” Snarled the Grand Xenoph", "“Thou shalt not appear in this section of the book. Also, AADESH GET OUT OF HERE AND STOP POSING AS THE GRAND XENOPH!!!” The authors shouted. Apparently, the fourth wall has been broken.", "“Oh come on! I don’t want to go to the orthodontist! But now this?!” I complained, trying to shrug off the immense pain. It felt like all of my teeth were being pulled out at the same time, no anesthesia. My jaw felt locked tight, and all this caused a very severe headache. Fumbling around with the stubborn orthodontic device, my fingers hooked onto a band and I pulled. The braces came loose a bit. I couldn’t call the others through my locked-up jaws, so I stomped my feet very loud to get their attention, and started pantomiming. First, I pointed at them. Then I yanked at an invisible band. Then I pointed to my mouth.", "“What in the world are you trying to tell us? Just talk!” Myke exclaimed in confusion.", "“You pull my mouth?” Eliza thought out loud.", "“You yank braces?” Myke laughed, “Come on, we don’t know what you’re trying to tell us! None of this makes sense!”", "I tried again.", "This time, I pointed at them again. But instead of pulling an imaginary band, I actually pulled it this time. Then I paused. After that, I pointed to myself, made an X with my arms, and did a chattering hands, pausing then pointing to them again and putting on my best pleading face.", "And guess what? They actually understood! They yanked as hard as they could, and the unwilling Axis Piece came off with a pop. Reshaping itself into a metal ball, It rolled away, only to land in the right hand of Reaper, holding a jam-smeared platter in his other hand.", "Shooting a single icy-cold stare at us, we all froze in terror. He opened his mouth to speak. “You have what I desire most. Now, I have come for it.” Walking slowly towards us, we could only watch and see what he was going to do. Putting a hand to my chest, he tried extremely hard to extract the Gem out of me, but pulled away as if burned. A symbol flashed and it burned my eyes, leaving behind a faint afterimage. An eye, with a spinning gem in the middle. Geometric shapes surrounded it, and rotated, with ancient writing on the sides that I swear I have seen before. It was gray in color, but flashed bright a few times. Then, it disappeared. Reaper looked just as confused as I did.", "The afterglow itself was as painful as the flash. It was like being flashbanged repeatedly, albeit a little less, and Reaper and I both clutched our heads in pain.", "“Nyk!” Kreigh shouted, alarmed. “What is going on? What are you seeing?”", "Reaper lunged towards me, trying to grab the Gem, but another repulsion occurred, like two magnets facing each other the wrong way. A burn flowed through my veins, as if I took a shot of lava. White-hot pain seared through me, like I was being poked by a thousand needles. Light shot out of me, and my friends rushed towards me in concern. Then, I felt myself warping away, with my comrades, and I saw Reaper’s hateful gaze, before our feet landed on solid ground, and I fell, exhausted. I looked up, and saw the Haven in the distance.", "But something was wrong. My eyes widened as I saw the new Haven."], "tall": true}, {"id": "chapter-27", "n": "27", "label": "Chapter 27", "title": "Swarm", "img": "28.jpg", "paras": ["The Haven had green cracks running through it as usual, but now, orange shot through the already powerful piece of architecture, and I realized something.", "“He got another Axis piece!” Myke yelled.", "Troopers swarmed out of the entrance, ready for their upcoming invasion. I gulped as I noticed that they were Trooper IIs. Green and orange auras of light surrounded their already imposing figures. They swiveled their heads to look at us, and aimed their blasters. Immediately, I raised my hands, ready to use the Gem’s power to hold them off. I strained my hands, but then I noticed something. Nothing was appearing. No energy, no fire, nothing. I looked in horror as the Troopers fired.", "Beams raced towards us rapidly, and there was no way to block the onslaught. We could only stand and wait for our doom. The Gem wasn’t ready to be used yet, and my own energy was drained from the encounter with Reaper. I laid down, limbs feeling like they were made out of lead. I could barely even feel myself, and I closed my eyes.", "<em>This is it. The end.<\/em>", "But the hits never came.", "Instead, something extraordinary happened.", "When I looked down, I saw the bottom of my boots, metallic and reflective. With great effort, I leaned forward and touched the soles of them, then pulled my hand back in shock as I felt that the bottom was burning hot.", "Let me first explain to you why. As for Rebellion tradition, all people new to the movement had to wear metal boots for the first three months after admission. The beams reflected off of the boots’ shiny bottom while also leaving traces of heat behind, redirecting somewhere in the Haven. From far away, I could still hear the chaos when the beams hit. Explosions. Screams. Metal crashing.", "My friends weren’t so lucky.", "Beams hit Kreigh in the chest and arms, Myke got hit directly in the stomach, and the beams singed off a part of Eliza’s hair and hit her in the back, leaving smoking wounds. Kreigh shrugged it off, but Myke doubled over in pain. But where was Win? And how could I block?", "A spark of inspiration flashed in my mind. <em>Win. The whirlwind.<\/em>", "Using every last bit of my strength and rushing in front of them to protect them from the barrage, I tried spinning around with the Jailbreaker in the way Win did when I battled him.", "It worked, to some extent, but I was hit all over my body, lighting up fires. Looking around in panic, I dropped, trying to extinguish the flames. In the confusion, I forgot to let go of my mace. Swiping in the air like a windshield wiper, it absorbed and batted away the beams, protecting the others from harm.", "Relieved, and not on fire anymore, I sat down in exhaustion.", "But below us, the Troopers and Trooper IIs swarmed around us with deadly efficiency. I knew this building looked familiar, but why?", "Myke yelled something, but I couldn’t hear him over the roar of flames ignited by the beams hitting a building behind us.", "Suddenly, Kreigh’s voice came loud and clear through the chaos.", "“The base has been breached!” Kreigh hollered, and we all burst into tears. We could do nothing to help the rest of the Rebellion. We were trapped outside. But at that moment, things made more sense.", "The papers. General Darkblade. Reaper. The shootout.", "Piecing together the details, I finally knew the truth. <em>We had fallen into a trap.<\/em>", "From below us, an explosion came, though nobody would have time to plant that much explosives. The building started to collapse, and we were left falling, all the way down to the ground, the wind doing basically nothing to stop our fall. This was really the end."], "tall": true}, {"id": "chapter-28", "n": "28", "label": "Chapter 28", "title": "Fall", "img": "29.jpg", "paras": ["You remember how I wrote that that was the end? I was wrong.", "As we fell, I contemplated my life, of all the good I’ve done to stop the Republic. I closed my eyes, and hoped that I could just get this over with. Having such a slow death wasn’t pleasant at all. I expected the hard impact to end it all, turning the three of us into human pancakes. But I felt a tug in my gut and the hit never came.", "I opened my eyes to find me hovering, face first, above the ground. But that’s when I remembered that I still had my friends up there. Seeing them in danger, I got up and channeled my energy. Despite trying, All I could muster up was a tiny piece of Axis Cloth, a strong, flexible material made from Axis Energy. Normally, I could do this to make a few parachutes, but I couldn’t do it now, because the Gem was on cooldown.", "In an instant, my friends were only a few feet away from the ground. I looked around. Win was already on the ground floor, fending off Troopers. Apparently, he wasted no time getting off that building. I saw Myke’s screaming face, Kreigh with his metal leg pointing downwards, and Eliza chopping down with her sword, dispatching several human Troopers. Blood splashed through the air in an arc, and I considered my plan. Eliza would be fine because the shock would be absorbed by the sword, though she would lose it. Kreigh’s metal leg would probably save him, but the joint might pop out and leave him incapacitated for the rest of the battle, and we needed him. Myke also needed help, but his underwear was glowing, so he would teleport to safe ground once it activated, even though Myke himself didn’t know what to do. But I was helpless. Stuck with only a piece of Axis Cloth, I had to find a way.", "First, I rushed over to Kreigh, whose leg would hit the ground first, and I caught the leg with the kevlar-like cloth, absorbing all the shock and bouncing him through. Eliza, as expected, planted her sword in the ground to save herself, sweeping around in a circle while balancing on the hilt of the circle, felling another row of Troopers similar to how the ancient legend Paul Bunyan felled trees, with zero effort.", "Then there was Myke. My energy was exhausted now, and I could do nothing to stop his fall. I couldn’t catch him, because my arms would give in. I couldn’t suspend him, because I couldn’t get the energy to bind him to me to slow his fall, and I couldn’t make a parachute for him because air resistance at a few feet can’t stop this deadly velocity that he already had. Myke looked forwards and widened his mouth in shock, and I followed his gaze to see Reaper glaring at me from within the swarm. This time, both of us were too exhausted to use our energy, so I aimed RAD at him, and fired. Reaper held up a shield, but my arrow ripped through, hitting him in the stomach. He was lucky to have armor on, but he yelped in pain. I realized that he was nothing without his Piece. Suddenly, I felt energy surge through me, as the Gem was waking up. Purple energy swirled around me like a mini tornado, but I saw the same thing happen to Reaper, albeit with white energy. The ground cracked under my feet, and I heard a familiar voice in my head.", "<em>I am back.<\/em>"], "tall": true}, {"id": "chapter-29", "n": "29", "label": "Chapter 29", "title": "Divided", "img": "30.jpg", "paras": ["I launched myself at Reaper, punching him in the jaw. Reaper retaliated by swirling up some white energy and launching strong winds at me, blasting me backwards like a leaf in a twister. I grabbed onto a rock, which started to crack, but I shot purple energy at Reaper, who dodged. I shot another one immediately and that seemed to catch him off guard, knocking him back 3 feet.", "Once the tempest had passed, we resumed our battle, exchanging blow after blow using arrows and Axis Energy. I leapt up and spun in the air, spinning downwards into Reaper. Unfortunately for both of us, the ground he was standing on was weakened from the explosion. It crumbled to dust and both of us tumbled down into the burning atrium. I saw a blue blur that I knew was Kreigh, who picked me up, leaving Reaper to fall into the roaring flames. He desperately tried to use the Eye to save himself, but it was too late. He fell into the raging inferno, limbs flailing, grasping for a way up. I caught my breath, and gave a look of thanks to Kreigh. I looked down, and the flames started to die out, emitting a thick curtain of smoke. I looked at Kreigh, who had a troubled expression on his face.", "“What’s wrong?” I wondered as Eliza and Myke sprinted down to meet us.", "“Nothing,” Kreigh muttered. “It’s just that-”", "Suddenly, a boom echoed through the halls.", "“Who had the time to plant all these explosives?” yelled Myke furiously. I knew he was joking, but part of me doubted it. <em>What if he was right?<\/em> I glanced at Kreigh and realized he was thinking the same thing. And he reached a conclusion. Someone inside the rebellion was doing this. A traitor. My head spun as my blood ran cold.", "<em>The suspect must have ties to the Haven and Illuminati, which means Eliza may have done this.<\/em> But I put that aside. <em>No, after what happened with Ivan, she seemed tortured, No way she would do this!<\/em> I thought about Win. <em>No, he would want to avenge Gnarn’s death.<\/em> But what about Kreigh? <em>No, that can’t be, he has been loyal to the Rebellion for the whole time. He wouldn’t give up this cause that easily!<\/em> But how about Myke? <em>It can’t be him. Not only is he not smart enough to pull this off<\/em>, I joked with myself<em>, but he’s my best friend! I know him, and despite his goofiness, he’s good at heart<\/em>. I pondered who it might be, but before I could do that, another boom followed by crumbling shook the room. I sprinted outside to escape the falling rubble, and the team followed soon after.", "The battle was over, and the base was ruined. The Troopers had left already and we and another group of rebels were the only ones left.", "I opened my mouth to report on the battle with Reaper, but Eliza spoke up first.", "“Win and I figured out who the traitor is!” she announced. “It’s Nyk.”", "I looked in shock. “M-me?!? But why?”", "“You are the only one who doesn’t have a reason we won’t suspect you. Besides, you have the most powerful Axis Piece other than the Eye. The Gem. You could be corrupted!”", "“But I was fighting Reaper! How could I have done this?” I questioned defensively.", "“That could have been staged,” reported Win harshly.", "“Not true!” shouted Myke. “Nyk would never do this!”", "“Stop arguing. We all know that nobody is at fault here,” Kreigh protested, trying to settle the conflict, but it had no use, as everyone just ignored him.", "“It has to be you!” Eliza concluded, as she rushed towards me, blades drawn. She took a few swipes at me, and I pulled back, deflecting the attacks with arrows. Win joined in, taking every chance and opening he had to land a hit in my unprotected areas. A stab to my back, a slash to my side, every move that he made was perfectly calculated. Taking a single fire arrow and nocking it to my bow, I fired on the ground, where it started burning for a short amount of time. Confused, Eliza and Win avoided stepping on the arrow, afraid to take the risk and get burnt. They thought I would set more explosives, but they clearly were wrong at what I was doing next. I didn’t have any water arrows, so I grabbed both a fire and ice arrow. The icy tip of the latter melted, giving way to a transparent blob of water, which reflected what was happening below. I jumped up and drew it, firing it again with precision on the way down. Eliza screamed as it whistled past her shoulder, and Win jumped out of the way. That, of course, was a serious mistake. The waterlogged arrow extinguished the fire, creating a smokescreen, giving me time to recover. Using Gem energy, I hypercharged an air-row and locked it into place. I let it clip on, giving myself time to recover my strength.", "In an instant, the smokescreen had cleared, and I saw Eliza leaping towards me, swords gleaming in the sunset, a brilliant blinding red. She was ready to chop me in two, if her blades hit. They would still leave an opening for my plan. Win rushed up behind me, Blocking off any escape to the back and sides. The only way out of this perilous situation was up.", "Which was exactly where I wanted to go.", "Firing my hypercharged air-row downwards, I soared thirty feet into the sky. Reorienting myself, I slung my bow over my shoulder and unstrapped the Jailbreaker. <em>I already know who the rat is, it’s either Win or Eliza. One probably convinced the other that I was the culprit. Now, time to do some skull bashing!<\/em> I am being serious with you right now, but that last thought wasn’t mine. Swinging the mace downwards, I started to rotate forwards in the air. The centrifugal force threatened to rip my arms right off my torso, but I held on fast. Faster and faster I spun, ready to hit the ground with the force of an asteroid colliding with the earth. If my estimates were accurate enough, I would hit between Win and Eliza, disarming and temporarily paralyzing them so I could bring the true backstabber to justice.", "Wind whistling past my ears, I hurtled downwards. As expected, Win and Eliza waited with their swords up, ready to attempt to parry my attack.", "My mace connected with the blades first, sending a shock through the arms of everyone involved. The heavy weapon easily batted the light swords aside, disarming them. Win started running towards Kreigh and Eliza jumped back, but the shock from the impact made it hard for them to escape. Win got launched into the air and landed on his behind, while Eliza did a double frontflip and twist to save herself.", "After getting up, Win resumed running towards Kreigh.", "At first, I thought nothing was wrong. Then I found it confusing. <em>Why is he running towards Kreigh with his sword drawn?<\/em>"], "tall": true}, {"id": "chapter-30", "n": "30", "label": "Chapter 30", "title": "Traitor", "img": "31.jpg", "paras": ["I grabbed Win by his shirt and pulled him back. “What are you doing?” I hissed.", "“Protect Kreigh! What if the Troopers came back?” Win shot back.", "“Ugh, you know as well as I do that the Troopers are leaving and never coming back!”", "“Well at least I wasn’t the one planting the bombs!” A strange look flashed across Win’s face. Eliza stood behind us, forehead crumpled up like a ball of scrap paper, glaring at us.", "“Just stop! I’m innocent!” I frantically defended myself.", "“Well, let’s see how that goes. Watch as I kill you, the real culprit!”", "“Win, you are in hot water already, picking fights with me,” I snapped, charging up a punch with Axis Energy.", "“ENOUGH!” Kreigh roared, “I’M SICK AND TIRED OF YOU ARGUING ABOUT WHO IS THE TRAITOR! There, I said it. Now, why don’t you two apologize?”", "“I mean, not really. It’s hard apologizing for something you didn’t do,” I responded, shooting a dirty look at Win and Eliza.", "“Me neither. At least this is what we have in common,” Win agreed, with a note of sadness present in his voice.", "“Hey, are you two stupid or what?” Eliza smirked, “We still have a traitor to catch!”", "We turned to Eliza. She definitely was suspicious, standing back and watching us fight each other. That last thing she said just made her even more possible as a candidate for the traitor. <em>What if the grounding and tortured expression was a fake? What if it was staged?<\/em>", "Eliza must have read our minds, because she charged at us, ready for a death battle.", "Win and I kept switching sides, confused as to who was really the one to plant and detonate the explosives, and ended up attacking each other. Things quickly broke down, and it was a chaotic free-for-all that left us panting, yet still wary of the others if they were to make a sudden move.", "Myke decided to join in as well, acting as a sidekick to protect my unguarded flanks. Ready for more, we all charged at each other, trying but failing to gain the upper hand.", "“Dodge left! Now duck! Jump up and shoot! Ow! Why did you hit me?” Myke cheered, but was elbowed in the stomach yet again as I drew another arrow.", "Win had left the area of the main skirmish, and Eliza and I were the only ones fighting.", "“You couldn’t have done it,” I implied through gritted teeth.", "“Well you could have!” Eliza huffed in the same manner as she parried an arrow.", "“I couldn’t have,” I repeated.", "“Proof?”", "“Ask Myke!”", "“Well, ask Win!” Eliza did a sweep kick to my legs, which knocked me off balance. I struggled to my feet, and used Jailbreaker to knock Eliza’s sword into a wall.", "“Did Win convince you?” I asked", "“Well, yes but-”", "I cut her off. “Then, why would Myke be on my side? Maybe Win is misunderstood!”", "“Well, why can’t it be Myke then?” she grunted as she blocked Jailbreaker with her sword.", "“Well, he has no motive,” I explained. Pulling back from combat, we stopped, scanning the area for Win, like cats searching for mice, waiting for an explanation.", "Win knew that he was next on the list to be attacked, so he made a mad dash away. But, he wasn’t running from us. He was running towards Kreigh.", "“You killed my father! You shall pay the price!” Win screamed as he rushed Kreigh, ready to stab the elderly rebel in the chest.", "My head swam with questions. <em>Wait, didn’t he know that his father died from his Axis Piece corrupting him?<\/em> I saw Win cover a quarter of the distance to Kreigh in one stride. <em>Why did he suspect Kreigh?<\/em> Win had already gotten halfway there. <em>Someone is gonna get unjustly killed soon. Either Win or Kreigh. I don’t want either.<\/em> Win was just a few steps away from Kreigh now.", "My eyes filled with tears.. I couldn’t let the rebel leader who had saved my life die so easily. He was everything to me. A second father. Almost family.", "Yet I also couldn’t control myself to see Win hurt one of his elders in blind rage. A close friend. A great warrior. The only proper solution to this was to pull both parties away from each other.", "Burning rage filled me, and I quickly charged up and fired a long-ranged Phoenix Talon Grab, which pulled Win back. Red-hot fingerprints dug into his shoulder, but Win kept charging. He almost reached Kreigh to deal the fin

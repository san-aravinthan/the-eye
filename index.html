<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Eye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800;900&family=Big+Shoulders+Text:wght@500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a night city under the Haven. Home = the watching pyramid + a wall of chapter plates; reader = one full-bleed illustration plate, then a narrow column of prose. Purple belongs to the Gem, green to the Haven. */
:root{
  --void:#0c0a11;
  --slab:#16131d;
  --rule:#2a2533;
  --ink:#ebe6f2;
  --dim:#9d95ab;
  --gem:#b88cff;
  --haven:#79e39a;
  --display:"Big Shoulders Stencil Display","Impact","Arial Narrow",sans-serif;
  --ui:"Big Shoulders Text","Arial Narrow",system-ui,sans-serif;
  --body:"Literata",Georgia,"Times New Roman",serif;
  --measure:36rem;
  --fs:1.125rem;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gem);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:color-mix(in srgb,var(--void) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:900;font-size:1.5rem;letter-spacing:.08em}
.brand svg{width:28px;height:28px}
.bar .where{font-family:var(--ui);font-weight:500;color:var(--dim);font-size:1rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .sp{flex:1}
.ibtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--rule);border-radius:999px;padding:6px 12px;cursor:pointer;
  font-family:var(--ui);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem}
.ibtn:hover{border-color:var(--gem);color:var(--gem)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--haven);box-shadow:0 0 8px var(--haven)}

/* ---------- home ---------- */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,5vw,72px);align-items:center;
  padding:clamp(32px,6vw,80px) clamp(16px,5vw,64px) clamp(24px,4vw,48px);max-width:1240px;margin:0 auto}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(4.5rem,14vw,11rem);line-height:.82;margin:0;letter-spacing:.02em;text-wrap:balance}
.hero h1 span{display:block;color:var(--gem);text-shadow:0 0 40px color-mix(in srgb,var(--gem) 45%,transparent)}
.hero .kicker{font-family:var(--ui);font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--haven);font-size:.9rem;margin:0 0 18px}
.hero .lede{font-size:1.15rem;line-height:1.6;color:var(--dim);max-width:30rem;margin:22px 0 0}
.hero .lede b{color:var(--ink);font-weight:600}
.byline{font-family:var(--ui);font-weight:500;font-size:1rem;letter-spacing:.06em;color:var(--dim);margin-top:18px}
.byline b{color:var(--ink);font-weight:700}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.cta{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:6px;text-decoration:none;cursor:pointer;border:1px solid var(--gem);
  font-family:var(--ui);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:1rem;background:var(--gem);color:#140d22}
.cta.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.cta.ghost:hover{border-color:var(--gem)}
.cta:hover{filter:brightness(1.08)}
.watch{position:relative;aspect-ratio:1/1;max-width:460px;width:100%;justify-self:center}
.watch svg{width:100%;height:100%;overflow:visible}
.cover-card{position:absolute;right:-8%;bottom:-20%;width:36%;border:1px solid var(--rule);border-radius:6px;overflow:hidden;box-shadow:0 20px 50px #000a;transform:rotate(3deg)}
.cover-card figcaption{font-family:var(--ui);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:var(--slab);padding:6px 8px}

.contents{max-width:1240px;margin:0 auto;padding:24px clamp(16px,5vw,64px) 80px}
.contents h2{font-family:var(--display);font-weight:800;font-size:2.4rem;letter-spacing:.04em;margin:0 0 6px}
.contents .note{color:var(--dim);margin:0 0 28px;font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.plate{display:flex;flex-direction:column;text-decoration:none;background:var(--slab);border:1px solid var(--rule);border-radius:8px;overflow:hidden;transition:transform .25s,border-color .25s}
.plate:hover{transform:translateY(-3px);border-color:var(--gem)}
.plate .pic{aspect-ratio:16/10;overflow:hidden;background:#000}
.plate .pic img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.plate:hover .pic img{transform:scale(1.04)}
.plate .cap{display:flex;align-items:baseline;gap:10px;padding:12px 14px 14px}
.plate .num{font-family:var(--display);font-weight:900;font-size:1.7rem;color:var(--gem);min-width:2ch;font-variant-numeric:tabular-nums}
.plate .t{font-family:var(--ui);font-weight:700;font-size:1.15rem;letter-spacing:.04em}
.plate .k{display:block;font-family:var(--ui);font-weight:500;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.plate.here{border-color:var(--haven)}
.plate.here .k{color:var(--haven)}

/* ---------- reader ---------- */
.stage{position:relative;max-width:1400px;margin:0 auto;padding:clamp(12px,2vw,24px) clamp(0px,2vw,24px) 0}
.stage figure{margin:0;position:relative;border-radius:clamp(0px,1vw,10px);overflow:hidden;background:#000;cursor:zoom-in}
.stage figure img{width:100%;max-height:78vh;object-fit:contain;margin:0 auto}
.stage figure.tall img{max-height:88vh}
.stage .zoom{position:absolute;right:12px;bottom:12px;pointer-events:none;font-family:var(--ui);font-weight:700;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;
  background:#000b;border:1px solid #fff3;padding:5px 9px;border-radius:999px;color:#fff}
.chapter{max-width:calc(var(--measure) + 32px);margin:0 auto;padding:40px 16px 24px}
.chapter header{margin-bottom:34px}
.chapter .k{font-family:var(--ui);font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--haven);font-size:.95rem}
.chapter h2{font-family:var(--display);font-weight:900;font-size:clamp(3rem,9vw,5.2rem);line-height:.9;letter-spacing:.02em;margin:6px 0 0;text-wrap:balance}
.prose p{font-size:var(--fs);line-height:1.78;margin:0 0 1.05em;hanging-punctuation:first}
.prose p:first-of-type::first-letter{font-family:var(--display);font-weight:900;float:left;font-size:4.1em;line-height:.78;padding:.08em .1em 0 0;color:var(--gem)}
.prose em{font-style:italic;color:var(--gem);text-shadow:0 0 14px color-mix(in srgb,var(--gem) 35%,transparent)}
.prose p.voice{text-align:center;font-size:calc(var(--fs) * 1.08);margin:1.4em 0}
.prose .brk{display:flex;justify-content:center;margin:2.2em 0}
.prose .brk svg{width:34px;height:34px;opacity:.7}
.prose.plain p:first-of-type::first-letter{all:unset}
.prose .credits{font-family:var(--ui);text-align:center;letter-spacing:.06em;line-height:1.7;font-size:1.1rem}
.prose .credits h3{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:1.4em 0 .2em;color:var(--gem);letter-spacing:.08em}
.prose .shout{font-family:var(--ui);font-size:.95rem;letter-spacing:.04em;color:var(--dim);border:1px dashed var(--rule);padding:14px 16px;border-radius:6px;line-height:1.6}
.prose .chain{text-align:center;color:var(--dim);overflow-wrap:anywhere;letter-spacing:.1em}
.sub{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:.04em;margin:2em 0 .6em;color:var(--ink)}

.pager{max-width:1000px;margin:24px auto 80px;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pager a{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;text-decoration:none;background:var(--slab);border:1px solid var(--rule);border-radius:8px;padding:10px;transition:border-color .2s}
.pager a:hover{border-color:var(--gem)}
.pager a.next{grid-template-columns:1fr 120px;text-align:right}
.pager a.next img{order:2}
.pager img{width:120px;aspect-ratio:16/10;object-fit:cover;border-radius:4px}
.pager .d{font-family:var(--ui);font-weight:700;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.pager .t{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.03em;line-height:1}
.pager .empty{visibility:hidden}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:#000a;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(380px,90vw);background:var(--slab);border-right:1px solid var(--rule);z-index:41;transform:translateX(-102%);transition:transform .3s;display:flex;flex-direction:column}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .drawer{transform:none}
.drawer .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--rule)}
.drawer .hd b{font-family:var(--display);font-size:1.6rem;letter-spacing:.06em}
.drawer nav{overflow-y:auto;padding:8px}
.drawer nav a{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:6px 8px;border-radius:6px;text-decoration:none}
.drawer nav a:hover{background:#ffffff0d}
.drawer nav a[aria-current="page"]{background:color-mix(in srgb,var(--gem) 18%,transparent)}
.drawer nav img{width:64px;aspect-ratio:16/10;object-fit:cover;border-radius:3px}
.drawer nav .k{display:block;font-family:var(--ui);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.drawer nav .t{font-family:var(--ui);font-weight:700;font-size:1.05rem}
.drawer .tools{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--rule);margin-top:auto;font-family:var(--ui);color:var(--dim);font-size:.9rem;letter-spacing:.08em;text-transform:uppercase}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:60;background:#000e;display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain}

.foot{border-top:1px solid var(--rule);padding:28px 16px 40px;text-align:center;font-family:var(--ui);color:var(--dim);letter-spacing:.08em;font-size:.95rem}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .watch{max-width:320px;order:-1}
  .pager{grid-template-columns:1fr}
  .pager a,.pager a.next{grid-template-columns:96px 1fr;text-align:left}
  .pager a.next img{order:0}
  .pager img{width:96px}
  .bar .where{display:none}
  .brand{font-size:1.2rem}
  .cover-card{bottom:-12%;right:-4%}
  .hero{padding-bottom:64px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="bar" id="bar">
  <button class="ibtn" id="menuBtn" aria-label="Open chapter list"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Chapters</button>
  <a class="brand" href="#home" aria-label="The Eye, home"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 37 35H3Z" fill="none" stroke="#b88cff" stroke-width="2.2" stroke-linejoin="round"/><path d="M10 24q10-9 20 0q-10 9-20 0Z" fill="#0c0a11" stroke="#ebe6f2" stroke-width="1.6"/><rect x="18.3" y="19.5" width="3.4" height="9" rx="1.2" fill="#b88cff"/></svg>THE EYE</a>

<main id="main"></main>

<script>
const STORY = {"sections": [{"id": "prologue", "n": "P", "label": "Prologue", "title": "Prologue", "img": "01.jpg", "paras": ["A figure walked into The Grand Xenoph's room, holding a glowing star. The star’s green energy pulsated through the room, being the only light illuminating The Grand Xenoph's figure. The room was dark, and spoils from intergalactic wars, piles of treasure, and several mounted disembodied heads of previous rebel commanders lined the walls. A caged dove struggled in a corner, trying to reach freedom but ultimately failing in its search. The Grand Xenoph had sagging skin, and smelled rotten, like a corpse. His bones showed through his thin skin. His robe was elegant, decorated with purple and gold, complimenting each other beautifully. His fingers were long and sharp, and his triangle head was transparent, revealing his brain. A broken golden balance lay at his feet. His eye turned towards the figure, and fixated on the star.", "“Master,” he began, “What I have here… is an Axis Piece.” He held up the glowing star; light bouncing through the room.", "“Good, good.” The Grand Xenoph rasped, his voice thin and frail. The unknown figure let go of the Axis Piece, and it levitated towards The Grand Xenoph. He held it in his fading hand, and placed it in a compartment beside his throne. Immediately, green wires illuminated the room further, sending a sinister green glow through the Haven, powering it completely. Green electricity seeped through The Grand Xenoph, through his blue veins. The Grand Xenoph’s brain glowed green, which shone through his transparent head. His body became solid, and his skin healed slightly.", "As energy surged through The Grand Xenoph, it reminded him of ancient times, when he could wipe out civilizations with a wave of his hand. As he aged, he grew weak, and required the devotion of his servants to keep hold of planet Earth. <em>My strength will grow,<\/em> he thought. <em>I just need more Axis Pieces<\/em>", "An indicator on The Grand Xenoph’s throne made it clear that he had received the power from the star.", "“Yes…” he whispered, his voice gathering strength with each word, building an almost imperceptible force. “I can feel it” He lifted up his hand, and a piece of the Haven wall crumbled to dust. Energy flowed through the room, The figure’s hair rustling with the sheer force of the Axis Piece. “Find the rest of the pieces,” his voice echoed through the room, “I must wipe away the sins of the universe. Soon, we shall reach purity.”"]}, {"id": "chapter-1", "n": "1", "label": "Chapter 1", "title": "Beginning", "img": "02.jpg", "paras": ["I waited patiently in line for my rations, a snake of starving people in front of me. I only got a few scraps from the Scrapyard, so I wouldn’t be getting much. The year is 3024. My name is Nyk. I'm 13 years old. I have black hair and brown eyes. I'm also a denizen of the Supreme Republic. Hah! Republic. None of the people get rights, except for the lucky few. New York was the capital of the Republic, and I lived here. Everyone calls it New Hell. That is what it was. I walked up to the tall robed man who glared at me with his gray, soulless eyes.", "“What scraps do you have this time, boy?” He inquired with a gruff voice.", "I dropped my load onto the table. “Here you go, Chirk.”", "“That’s it? That’s all you got? Well, you’ll be getting ⅛ of a ration,” Chirk sneered.", "“But a pound of scraps is worth ¼ of a ration. I tested it, and it’s 1.2 pounds!”", "“Ha! Nice try boy, but a peasant would never be able to afford a scale! ” Chirk laughed. I looked up at the giant floating pyramid that was appropriately named “The Lord’s Haven,\" or “The Haven” for short. Ever since the Illuminati came out of hiding, us humans had to live like slaves. The Grand Xenoph was the leader of the aliens the Illuminati worshiped. The Grand Xenoph was a powerful being that no one dared oppose. In its prime, with a simple wave of its hand, it can issue the most horrible fate on those who dared to cross its wretched path. Fortunately, as it aged, its power waned, and required the worship of humans to keep its power. The Illuminati got to live in The Haven, where all of their needs were fulfilled, and they lived a life of luxury and plenty. That is if they pledged their loyalty to The Grand Xenoph and its fellow aliens. Chirk was one of such lucky people.", "<em>But why did he need scraps?<\/em> Suddenly, I heard a commotion. <em>The troopers!<\/em> The troopers were the army of The Grand Xenoph, and were capturing rebellious people. That’s when I realized… I’M IN TROUBLE! I ran as quickly as I could, but the troopers were faster. They closed in, and my puny legs were not helping. I ran for my life, clutching my scraps, sweat pouring down my face. I turn around, and I see an old man with long grey hair, uneven eyes, a large nose and a nearly toothless grin, blocking the path between the troopers and I. He had a walking stick with a rotating pyramid. The old man knocked one of the troopers out, and a blue shield surrounded me and him. We were whisked away to who knows where. And what I saw <em>blew<\/em> my mind.", "I looked around the new place. It was an underground cave, with glowing vines all around. The man walked up to me, and put the pyramid onto my chest. It glowed a brilliant blue, vibrant light flashing all over the room.", "“It’s him,” the man whispered. “The chosen one,\" I could not believe my eyes. <em>The chosen one? For what? Why me?<\/em>", "“For the last time, Gnarn, there is no such thing as a chosen one! That’s just some dumb story!” another voice hissed from the shadows. Gnarn frowned.", "“If what you just said was true, why do you think we captured him?”", "The person that told Gnarn the disillusioning news that I was not a chosen one stepped out of the shadows. His face had over a hundred scars, his left arm missing and his leg made out of rusted metal. Something had obviously happened to this poor man.", "“We caught him to save him from the troopers, you imbecile!”", "“Ohh… I see your point, Kreigh,” Gnarn apologetically murmured.", "Kreigh sat down on a big rock. I finally had a chance to look around the place now that Gnarn’s stinky breath was out of the way. It looked like a cave straight from the Paleolithic, its walls filled with an enigma of letters. I speculated that this may be a series of encoded words to list down important things. There were candles everywhere, to make up for the loss of energy. Fire crackled, and the shrewd stench of mystery meat filled the room. I gagged at the scent, and turned away to see Kreigh peering at me like I was some sort of lab rat.", "“You wanna understand the Code?” Kreigh asked when he saw me looking at the walls..", "I jumped back. “What?”", "“You obviously hate this place,” Kreigh remarked. “Why don’t you join us rebels?”", "“R–rebels?” This was filling me with too many questions, half of which I was sure Kreigh wouldn't know the answer to.", "Suddenly, lasers rained down through the ceiling, and down came troopers. Lightning fast, they rounded up all the rebels, including me. The main trooper in the crowd walked towards us, and took off their helmet, revealing himself to be General Darkblade, clearly the general of these troops. General Darkblade was The Grand Xenoph’s main enforcer, doing all the dirty deeds while The Grand Xenoph himself watched with glee from his viewing room atop the Haven.", "“After a long time, we finally found you rebels!” General Darkblade proclaimed.", "Kreigh put his hands up in surrender. “Leave the boy alone. He has nothing to do with us.”", "General Darkblade laughed. “Sure he doesn’t. Why was he in your lair then?”", "Gnarn thought for a moment, and then growled with frustration, and bit a trooper. I wish I could make this up. He bit him. The trooper jumped around, howling in pain, and General Darkblade punched Gnarn in the face with his jetpack propelled hand.", "“You assaulted a trooper! You are going straight to the Rehabilitation Camp!” General Darkblade sneered. I gulped. Even though the name “Rehabilitation Camp” doesn’t exactly scream evil, it was one of the worst prisons ever, where the so-called “students” were tortured beyond recognition.", "“Does this mean we get to see the Lord’s Haven?” mused Gnarn wistfully.", "“Not the time, Gnarn!” Kreigh growled, “We’re being captured!!”", "I looked around, desperately looking for a shrewd escape. No one ever wanted to go to the Rehabilitation Camp, with predatory criminals and an ocean of cries, and a vast amount of anguish.", "“Stop!” A voice commanded.", "“Who do you think you are–” General Darkblade started to snarl, but stopped midway. A girl about my age walked into the room. She was more regal looking and athletic. She had brunette hair and brilliant blue eyes. I looked at her closer and gasped. She was the princess! She was the daughter of the king of the Republic, Ivan Damazcus.", "“Princess Eliza, what are you doing here?” asked General Darkblade.", "“Leave them alone. What harm are they gonna do? They are just rebels,” explained Eliza. She shot a look that may have either meant, “Leave, you worthless peasant scum!” or “Don’t stand up to the Republic again!” Either one meant trouble.", "“My sincere apologies, Princess Eliza, but they have to be in the camp,” General Darkblade declared, “A princess shouldn't be dealing in these matters as it is. That is why I’m here. Please go back to the Haven!”", "Eliza exited with a scoff, her heels thudding on the steel floor..", "“Now,” General Darkblade roared. “Follow me!” A shuttle flew in with the Illuminati symbol on it. I looked around sadly, as I walked into the ship, Grarn and Kreigh following me. There was no hope. In this world, there never is."], "tall": false}, {"id": "chapter-2", "n": "2", "label": "Chapter 2", "title": "Rehabilitation", "img": "03.jpg", "paras": ["Day 1 of Rehabilitation Camp. I struggled to wake up, only to meet face first with a whip. After I reoriented myself after getting whooped straight in the nose, we had to do agonizing chores like carrying a giant scrap of metal over a bed of nails into the forge to be re-casted into something else. My back hurt, and every time we took a break, even for an attosecond (for those who are wondering, it's 1 quintillionth of a second.), your back would meet with a whip. The whip and your back will soon become great friends, they meet each other a lot already! And, you have to see the pyramid-headed, one-eyed humanoid monsters that roam around, the Eyes of Providence. During the 10 minute lunch break, I heard a tiny bit of gossip from some fellas. Here’s how it went.", "Person 1: “Hey, did you hear? The Republic is working on a new experimental weapon!”", "Person 2: “Really, what does it do?”", "Person 3: “I heard that it will make The Grand Xenoph young and all powerful again!”", "Person 2: “Man, that sucks.”", "I reeled back in shock. <em>The Grand Xenoph wanted to become more powerful? But why? Was he going to conquer other planets?<\/em> I looked around for Kreigh and Gnarn. I noticed that Gnarn was looking a little…unhinged. I stood up, and suddenly, banged into a person. I looked in surprise. It was Prince Reuben, Princess Eliza’s older brother!", "“Watch where you’re going peasant!” Reuben sneered. “You ruined my fancy robes with your filth!” Rage fueled me like a rocket. Without stopping to think, to consider the consequences of my actions, I punched that snotty brat straight in the nose. I kicked him in the shin, and then slapped him real hard on the cheek. As a finishing blow, I raised up a chair and suddenly, white-hot pain rushed through me. The pain was like needles being stabbed into every part of my body, a trillion times over, while being in the core of the sun. I looked behind me, and saw General Darkblade, who was shooting me with an ominous green beam.", "“Sorry kid. You’re gonna have to see Ivan now.” Then, I blacked out.", "When I woke, I saw myself in a room. Illuminati members were in an organized line. In the center, there was a human covered in shadow on a throne. <em>Ivan<\/em>. I got pushed forward into a circle on the ground.", "“Who is he?” a cold voice rasped. Ivan’s voice itself already sent shivers down my spine.", "“A boy named Nyk,” General Darkblade announced.", "Ivan stood up, and walked towards me. I saw him in his entirety. He had a muscular build, intimidating armor, and a glare that made me freeze in my place. But, here’s the thing about his eyes. Or, eye. Or, no eye. One of his eyes was missing, and the other one had a huge scar on it, making it pure white. <em>Ivan is blind, but that obviously doesn’t stop him.<\/em>", "“So, you wasted my seconds, bringing this random boy from the Rehabilitation Camp?” Ivan snarled, staring at General Darkblade.", "“He attacked Prince Reuben,” General Darkblade argued.", "“Sure, but you should have disciplined that boy himself! How dare you disturb me with these trivial matters?” Ivan seethed. His shoulder pads started glowing,", "Like magic, green lightning shot out of the pads, and aimed at General Darkblade, but stopped midway. I gulped, seeing his immense power for the first time. Technology has really improved in the Haven.", "“Since he has disobeyed The Grand Xenoph’s Empire three times, he will still get punished,” Ivan rasped. The Illuminati members circled around me, until, suddenly, a brown hooded figure appeared. They wore a black mask with a cartoony sharp grin. They were about my height, and had a sword. They jumped straight into the legion, and knocked one out with the hilt of their weapon, sliced another guard in the chest, and punched a third. “The Hooded Devil!” A trooper exclaimed. I decided to help this “Hooded Devil,\" and picked up a random rock, and slammed it on a dude with a huge laser blaster. After reorienting himself, he aimed his blaster. Before he could shoot, the Hooded Devil did a triple backflip, and landed on the Illuminati fella, then, using him as a spring, jumped up, and corkscrewed into a Superman-like pose, and punched the last person. Before I could stop and think about how they could have done that, Ivan rose out of his seat.", "“Enough!” he roared, and he shot lightning at the mysterious figure. They tried to dodge, but the explosion managed to hit them, causing them to roll over. I was next, but then, Gnarn appeared with his staff. A blue forcefield surrounded me and the figure, while Kreigh came and fought off Ivan with a giant axe. Me and Gnarn picked up the hooded figure and started running. Gnarn used his magic pyramid to slow down Ivan, and we managed to escape into a vent.", "“That was a close one,” muttered Kreigh.", "“How did you even get here?” I inquired.", "“We jumped on an airship carrying supplies!’” answered Gnarn with a huge grin. “Who is this hooded fella?”", "As Gnarn uttered those words, the hooded figure woke up, rubbing their head."], "tall": false}, {"id": "chapter-3", "n": "3", "label": "Chapter 3", "title": "Escape", "img": "04.jpg", "paras": ["I looked at them. There was a nasty cut on their leg, and their wrist was slightly bent.", "“You moron! What made you think a young child like you could take on the Republic?” they demanded.", "“I–uh,” I stammered. I decided to change the subject immediately. “Who are you?”", "“Why would I tell <em>you<\/em> of all people?” They retorted. “No one must know who my true identity is, especially a child like you.”", "“How long have I been out?” I asked Kreigh.", "“A month.”", "“A month?”", "“A month,” Kreigh repeated. “Gnarn has been…unwell.” He looked at his comrade with concern.", "Suddenly, Gnarn lunged at me. “Can’t…take it anymore…THE PAIN!” Gnarn hit me with his staff, launching me back. He flipped up, and shot a blue projectile. The Hooded Devil, although wounded, jumped up and blocked the blast with their sword. Kreigh looked at Gnarn with horror.", "“What happened to you?” Kreigh murmured in sadness.", "Gnarn stood panting and shaking rapidly. Sweat was pouring from his face as his erratic movements got more sudden. When he couldn't get crazier, he simply collapsed on the floor, unconscious. Kreigh looked in fear.", "“G-Gnarn?” Kreigh stuttered, shocked from what just happened. “Wake up! Come on!” Kreigh kept trying to shake Gnarn awake, but his eyes dimmed, and he let out one final gasp. Tears flooded down Kreigh’s eyes as he looked at his friend.", "“We have to keep going,” groaned The Hooded Devil as they sat up, grimacing as they put weight on their cut leg. “Troopers are after us!” As they spoke, a bunch of troopers led by General Darkblade started chasing us. We crawled as quickly as we could, but the troopers were closing in on us. Kreigh picked up Gnarn’s staff and created a barrier. A few Troopers were inside the radius, but Eliza and I teamed up on them, knocking them out of the other side.", "“Look, the exit!” I cheered. The Hooded Devil broke open the vent door, and we rolled out into the Dining Room. I looked at the wonderful plates of food, the smell filling my nose, and the hills and mountains of sweets, savories and bread. Before I could grab a slice of pizza, General Darkblade appeared through the vent, and jumped down.", "“Your treachery ends NOW!”", "My stomach growled. <em>Not the time, man<\/em>. General Darkblade looked at us with rage. He looked at the hooded figure.", "“Ah, the Hooded Devil. Great to see you again,” he hissed. “Well, it doesn't matter. Time to end all of you!”", "Kreigh held up his staff which glowed with power. The Hooded Devil flipped up their sword, ready for battle. I held up a pizza.", "“Aw, come on! Why don’t I get a cool weapon?” Well, it didn’t matter, because General Darkblade was already charging. I threw my pizza at him, which slid down his face, leaving a greasy, cheesy trail. But General Darkblade just shook it off. I groaned. The Hooded Devil jumped at General Darkblade, and tried hitting him with her sword, but General Darkblade launched her back with a green forcefield. Kreigh shot a blue projectile, but General Darkblade countered with a green one.", "“We have to retreat!” Kreigh hollered. We ran away, General Darkblade in pursuit. Kreigh used the staff to create a forcefield, and General Darkblade tried firing a green laser. The barrier started to crack. We managed to get on an airship, and it started to fly, but General Darkblade jumped on and approached us menacingly.", "“Run!” I yelped. A nearly jumped into a starting run, and pushed my legs into the ground as hard as I could to get away. The Hooded Devil was limping and leaning against Kreigh, who was shooting blue fireballs at General Darkblade, trying to slow him down. The Hooded Devil’s sword glowed orange, and they parried green lightning bolts fired at us. Meanwhile, I was looking for a cool weapon to use. I just so happened to find a bow with cool-looking arrows. One quiver had flaming arrows, another with lightning bolts, a third with icy tips, a fourth with wind whirling around it, and a fifth dripping with a yellow liquid. I picked up the bow, loaded a lightning arrow, and drew it. The energy crackled, and sparks of heat flew out into my face. The bow somehow arranged itself into position. I let go of the string, and electricity hit General Darkblade straight in the chest, knocking him back. I picked up a fire arrow, and used it as a pen to make a fire barrier by drawing a rectangle around a stack of boxes nearby. While he couldn’t see in the smoke, we hid behind the boxes.", "“Quick thinking,” The Hooded Devil panted. Their injury was getting worse from the stress of running. I looked throughout the cargo and found a first aid kit. I opened it and fumbled at the gauze. After wrapping it around the swollen spot, I used another cloth as an ankle brace.", "“We need a plan to escape,” whispered Kreigh, as he let The Hooded Devil’s arm around his neck. “But what do we—”", "I fired a lightning arrow at the ground, creating a hole.", "“So are we just gonna…jump down? Like, go splat on the ground?” questioned Kreigh.", "“Nope, not doing that,” responded the Hooded Devil almost immediately. They then turned on a switch in their boot, which caused some kind of magnetic field which allowed them to fly away.", "“I have a friend,” I answered. Suddenly, a smaller airship came, and had the person who would save us.", "“Myke!”", "“Hi Nyk!"], "tall": false}, {"id": "chapter-4", "n": "4", "label": "Chapter 4", "title": "Plan", "img": "05.jpg", "paras": ["“How did you know we were here?” asked Kreigh.", "“Oh, my BFF over here called me!” answered Myke with his stupidly huge grin. I wondered how one could be so cheerful during the apocalypse. Myke had dark skin and blond hair. His eyes were a mellow green. We jumped onto the airship, and the top closed. Myke flipped some levers, and the ship blasted off at full speed. Eventually, Myke dropped us off far away from New York. “No one will find us here,” he proclaimed happily.", "“So, the Republic is after us. What do we do now?” asked Kreigh.", "“We need a plan to take down The Grand Xenoph,” Kreigh announced. I looked at my cool and powerful bow, and all the arrows, fire, ice, lightning, air, and probably poison. Or is it venom? You can't really tell unless you are hit.", "“I’m naming this RAD, for Republic Assassinating Danger.”", "“Nyk, you suck at naming things,” concluded Myke.", "“Screw you,” I muttered.", "“We have to be serious,” Kreigh growled. “The Republic has already taken one of us.” He paused, remembering Gnarn. “And they could end the rest of us if they wanted.”", "“So, what’s our plan?” asked Myke.", "I looked at the huge pyramid in the distance. We needed to take down the “Republic,\" through whatever means necessary. I thought hard, about a plan that just might work.", "<em>What do we have that the Republic doesn’t? Nice looking faces? A better personality? Not being a total joke?<\/em> None of these were going to help against a super powerful empire of aliens with superior tech and strength. “We can send someone to spy,” I suggested.", "A hooded figure jumped down from the ceiling.", "“The Hooded Devil!” we all screamed in fear.", "“I can do that,” they reported.", "“Now, whoever you are, you need to head back now so it will not be suspicious. Myke can drop you off in a secret area close by.”Kreigh grunted. The Hooded Devil stood up to leave, but I stopped them.", "“I need one thing answered,\" I turned to them, my question running through my brain. “What does the Republic need scraps for?” They looked me straight in the eyes.", "“The Grand Xenoph wants to become more powerful,” they murmured. I remembered the experimental weapon. “Despite having a lot of supplies, they lost one thing. The Axis.”", "“The Axis?” I wondered.", "“Long ago, there was an artifact known as the Axis, which had immense power. It was how The Grand Xenoph got his power. But, it broke, I don’t know how many parts it broke into, and as he aged, he got weaker. He needs the Axis back to get into his prime state,” The Hooded Devil narrated. “If we want to stop the Republic, we need to get it first.”", "“I have a piece of the Axis,” Kreigh imputed. “The rotating pyramid on Grarn’s staff. It is a piece of the Axis.”", "Everyone’s jaws dropped.", "“So…we had a piece of the Axis this entire time?!?” gasped Myke.", "“So does The Grand Xenoph,” The Hooded Devil grumbled. “How many more pieces do we need to get?” It was math time.", "“Do you know the volume of the entire Axis?” I asked.", "“No! I wasn’t even born back then!” they exclaimed. “And they aren’t even equal!”", "“Well, there goes my entire idea,” I groaned. “But however many pieces there are, we need to find them all before The Grand Xenoph. Even if he isn’t restored to his full power, he will still be able to destroy all of us.”", "“That’s a happy thought,” mumbled Myke. “Well, LET’S GO, REBELS!!!!”", "“If you chant that again, your head will be facing the wrong way,” Kreigh snapped."], "tall": false}, {"id": "chapter-5", "n": "5", "label": "Chapter 5", "title": "Searching", "img": "06.jpg", "paras": ["A few days after our meeting, Myke, Kreigh and I were foraging through the Scrapyard. Eyes of Providence were watching as guards, and I felt the blistering heat on my back. Ever since The Grand Xenoph came out of hiding, as I’ve been told, many days were blistering ninety-degree days, some other days would be commonly a few tens of degrees below zero. The weather was very erratic, and we rarely had a clear, perfect sunny day. I wonder if it was actually like this before The Grand Xenoph.", "“Hey! I think I found one!” exclaimed Myke.", "“That…is a PC screen,” Kreigh hissed. I rolled my eyes. <em>How are we ever going to find an Axis Piece at this rate? Besides, we don’t even know how many there are, or all their shapes!<\/em> But then I stopped and thought to myself. <em>The Hooded Devil wasn’t born back then…but Prince Reuben was!<\/em> I know, this idea is stupid and utterly moronic, but it was our only choice. But there were two big fat problems. One, we need to get into the Haven, and two, Prince Reuben probably hates me after I socked him in the face. But, it was worth a shot. I told Kreigh my plan. I don’t think he liked it very much. He stated his honest opinion, and I quote:", "“I’m surprised how someone who came up with this plan managed to find a way to escape General Darkblade.”", "“But Kreigh,” I argued, “It’s our only chance to not be searching for our entire lives!”", "“And one of the times we will fail miserably, Nyk!” Kreigh snarled back. “If we get caught, Rehabilitation wouldn’t be enough punishment for us—we would get executed, painfully…” I shuddered. Execution wasn’t something the Republic took lightly. If you were to be executed, they would make you feel as much pain as possible. They brought back the ancient technique of crucifixion, just to torture the poor denizens.", "“But this is more important. If The Grand Xenoph got all of the Axis Pieces, the entire universe wouldn’t be safe from his wrath!” I looked Kreigh in the eye. “If you don’t want to be a part of this, fine! But I’m going, and you can’t stop me!” I stormed off, seething with anger. Suddenly, I bumped into Chirk.", "“Where do you think you’re going, pal?” Chirk growled."], "tall": false}, {"id": "chapter-6", "n": "6", "label": "Chapter 6", "title": "Discovery", "img": "07.jpg", "paras": ["“I heard you defying The Grand Xenoph. Anyone who does that will be sent straight to Rehabilitation. But, this is your third offense. You deserve a fate much worse,” he sneered. Chirk held up a purple jewel, glowing with energy. The energy ripped through the area, nearly knocking me down. “I was going to hand this in, but first, I gotta wipe you off of this earth!” Chirk raised up the jewel, and rocks rose out of the ground. Myke rushed to my side, hearing the noise. I readied RAD, and loaded up an electric arrow. Rocks flung at us, and we deflected them. Me with my bow, and Myke was screaming and dodging them because he had no cool weapon.", "We retreated to the Scrapyard, where Myke found an old laser gun from maybe the 3000s. Myke aimed and fired at the rocks, but the Axis Piece was overwhelming us, until suddenly, a new person that had some of the features of Gnarn jumped out and tackled Chirk. I readied my electric arrows and fired at Chirk. He tried using the piece to make a shield, but the arrow collided with him before he could, sending jolts across his arm.", "The Axis Piece quickly absorbed the shock, shooting purple electricity through the air. Chirk screamed as the energy coursed through him like he was an electric circuit, and a ball of light enveloped him and the Axis Piece. When the blinding light disappeared, the Axis Piece was nowhere to be found. Chirk lay down, blackened with ash and clothes smoldering, in a crater on the ground. We looked up at the young man who tackled Chirk.", "“Who are you?” I asked slowly.", "“My name is Win. Win Setose. I am the son of Gnarn Setose” We all looked at him in shock. “You are the son of Gnarn?” I asked.", "“That’s what I just said,” he answered. “I want to avenge my father’s death at the hands of the Republic.”", "<hr>", "As we walked to who knows where, Win started jabbering on and on about the sins that the Republic had committed.", "“Once, they obliterated a whole entire city on the other side of the continent because one single citizen put posters up opposing the Republic! And how did the guy get paper, anyway? And they hosted live vivisections a few years ago in the scrapyard!” Win ranted.", "I shuddered. About 3 years back, the Republic dismembered a poor denizen that way using a burning hot knife, which was probably infected with tetanus. And it was in the Scrapyard, where all the denizens of New York could see. I could just stare in horror as the poor person was sliced straight down the chest. I dare not tell the rest to you, because it was too gruesome. The last Scrapyard Manager before Chirk, Ringe, was killed in public by airship dragging just because Ivan Damazcus stepped on a very sharp rusty piece of metal there.", "Win just went on and on. “And a decade ago, we lost one of our most dedicated members, who was vaporized when finally coming face-to-face with The Grand Xenoph. He —”", "“WE DON’T TALK ABOUT THAT!” snapped Kreigh, obviously annoyed, “I’LL TAKE YOU BACK TO CAMP TO BE DISCIPLINED!” Then he turned to me. “We’re heading back to camp.” Kreigh announced gruffly. “I don’t see why you can’t come, but I can’t trust you to not leak the location. The Republic has cameras everywhere, as you know already. They see everything, so we cover things up in multiple locations. We jam their signals with untraceable technology. They can only get information out of those who have been in the Base. So sorry if this is unfair.”", "Kreigh raised Gnarn’s staff to strike, then everything went black.", "I woke up in a rather well furnished room, laying on a plush bed. A 31st century alarm clock sat on the bedside table, its holographic digital display hovering in the air. Searching my pockets for any anomalies, I found a lump in my pocket and pulled it out. Inside my pocket, there was a card. I held it up and examined it carefully, reading out loud. “Nyk, Last Name Unknown,” I read aloud, “Rank B Rebel Fighter. Grant all special access on seeing this card,\" I held it up to the alarm clock, and a message flashed across its holographic projector: “Hey Nyk, If you’re reading this, Welcome to the Rebel Camp, Internal Base. You are officially a member. Yes, we have good stuff directly comparable to that of the Haven. Don’t ask, we raided them from supply ships. You are starting as Rank B, Most start as Rank D. You have proven yourself. Meet me in my office today at 10 in the morning sharp. Don’t be late, I have something important to tell you. Best regards- Kreigh. (P.S, your card will provide you with the map, don’t worry. Also, if you lose this, I have extras.)”"], "tall": false}, {"id": "chapter-7", "n": "7", "label": "Chapter 7", "title": "Trials", "img": "08.jpg", "paras": ["After getting a quick breakfast (which was about half as good as that pizza I got from the Haven), I started making my way down to Kreigh’s office. The camp was a labyrinth, twisting and turning in all directions possible. The Executive wing was on the bottom floor, probably halfway from the surface to the core of the Earth. The place was just simply huge. There were huge laser grids and extreme entry puzzles, all that could stop The Grand Xenoph, if it were not for his wall-vaporizing abilities. There even was a chamber with multiple false doors, which each would shoot pressurized water, lasers, and sparked electricity if destroyed. That would definitely keep The Grand Xenoph at bay! After a long walk, I reached the office. The door opened with a soft creak. Kreigh was sitting inside by a soft fire that I believe was the last active volcano in the world, after The Grand Xenoph froze the world over to torture the poor denizens. The camp itself probably violated about 386 of his laws, by the way. I could recite them all, because all humans were to memorize his big fat book of laws in the Scrapyard School, and they were murdered if they couldn’t learn it in a year.", "“So, Nyk, we have a dire situation on our hands. The Grand Xenoph has gotten another Axis Piece. There are now fewer of them left! We need to really race for it. The Grand Xenoph may be powerful enough to vaporize a wall with a wave, though it may really get it out of him. He is slowly gaining strength. Good thing we have ancient relics…” Kreigh jumped in.", "“What are they?” I asked excitedly, “Can I have one?”", "“No.”", "“Please?” I pleaded.", "Kreigh stopped for a second and pondered it a bit. A look of recognition flashed across his face, but quickly was replaced by his usual grimacing sternness.", "“You know what?” he sighed, “You are very like Gnarn.”", "“Is that a yes?”", "“No, it’s a not yet.”", "“Then what do I have to do?”", "“You have to prove yourself…”", "“How?”", "“In combat.” Kreigh smiled sinisterly.", "<hr>", "I readied RAD as the snow fell across the field. Win Setose stood in front of me, arms crossed, tapping his foot", "Everyone in the Rebel Base knew that he was the most fearsome warrior in the whole entire Rebellion, slaying countless Troopers over the years. It was an honor to face him in a duel, though I was very sure that I would lose quickly. With little combat experience, how could I beat a seasoned fighter?", "Expecting something like an announcement to start the duel, I stood and waited.", "Apparently, I was wrong. Win lunged towards me with his sword and I leaned backward, but the blade caught my armor, the shock making it feel my joint was dislocated. The blow sent spinning across the field. I knew it: I have started on the wrong foot. Win dashed forward to follow me, hacking away as I parried his attacks with arrows. His attacks usually caught me off guard, like to the side of my face or my legs. He did a front slash, and I jumped to the side and literally threw an arrow. Yes, I threw an arrow. I know that I’m not supposed to do that, but whatever. I was desperate. That electric arrow stopped him enough for his brain to stop braining. He tried a hasty side slash, but years of Scrapyard work had made me nimble, and I easily jumped on top of his blade and backflipped out of the way. I shot a lightning arrow below and landed on a sparking blue platform. I used one of my fire arrows to create a smokescreen. But then the queerest thing happened.", "Win spun around in a circle, creating a whirlwind that quickly extinguished my firewall. However, the smoke still remained thick. I heard a blade whistling towards me, and I ducked, feeling the cold aura of metal skim past the top of my head. I tried countering, leaping above the smoke and shooting down a rain of arrows. Then time seemed to crawl at a snail’s place. I could see the smoke billowing out from below slowly. A singular snowflake fell in front of me so slowly that I could pick out the tiny crystals inside. It sort of looked like a tree mirrored along its roots on a six-pointed star. As I reached out to touch it, it slowly disintegrated, leaving behind a single clear raindrop surrounded by the flurry of snowflakes. As it fell rapidly towards the ground, I snapped back into focus. I peered back through the smoke. Through an apparition for a good ten seconds as I perceived it, I saw Win’s confused face peeking out. I’m sure he saw me too. He still looked in great shape, though he had several dents in his armor. I was searching RAD for any secrets because I had time to kill up there. Then, I found Win’s blade tip shooting up on a string towards me. I dodged it, but it made a tiny cut in my arm. It felt numb from first impact, sending jolts of lightning-force electricity through me. I found a mysterious golden button at the top of RAD. One icy arrow became many. I shot them through the smoke in an icy spire, diverging and converging in the shape of twisting serpents. When the smoke cleared, Win sat down in exhaustion, very much bumped and bruised from arrows hitting his armor, exhausted trying to fend off the onslaught of arrows. I sat down next to him and helped him up.", "“Wow, you’re so good! I could never do better myself!” he exclaimed.", "“Gee, thanks. It was all my bow, by the way.”", "“Nah, you should get promoted to rank A!”", "“I’m not that good anyways. I haven’t trained in a while.”", "“Let’s see, you should really tell Kreigh to check the cameras.”", "“No, no, no. He’ll kill me for hurting you like that.”", "“No worries, it’ll go away.”", "“Let’s go tell Kreigh about the battle.”", "“Okay, when do we go?”", "“Now! Race you there!” I shouted. I ran across the icy ground, my shoes squeaking across the ice. The exhilarating feeling of racing the one and only Win Setose was just too strong. Win was not as quick to get there, because he slipped on his first step.", "“Wait for meeeeeeeeeeeeeeeeeeeeeeee…” He trailed off, sliding across the ground like a giant bowling ball.", "Next thing you know, he knocked me down, bowling pin fashion."], "tall": false}, {"id": "chapter-8", "n": "8", "label": "Chapter 8", "title": "Gifting", "img": "09.jpg", "paras": ["When we got back to Kreigh’s office, we sat down for a chat.", "“Who won?” Kreigh asked.", "“He did,” replied Win.", "“Maybe just luck,” I denied.", "“Win, you just lost to a rank B newbie. What do you have to say for yourself, eh? As a rank A, how could you lose?” Kreigh inquired, raising an eyebrow.", "“Sorry, this guy has the combat skills of an S tier fighter,” Win complained.", "“Then get better! You are hereby demoted to a rank B fighter!”", "“But Kreigh…”", "“No buts!” Kreigh thundered. He turned to me, “As for you, you are promoted to Rank A plus. Here’s the relic you asked for.” He handed me a scroll, which had strange inscriptions on it. I gently touched it with my fingers, then it was gone.", "“The relic has a strong link with you. Now before you go, we have an Axis Piece reportedly appearing in the Treasury Room. Take a brief look there. After that, I have an important other mission for you. Also, train more before you go. That measly strength is not enough to beat The Grand Xenoph.”", "<hr>", "In the training room, I mustered up the energy to conjure up the scroll again. I raised my card to translate it, and it explained: Steps for How to Do the Phoenix Talon Grab. This was definitely an ancient text from the 20th century. I followed it the whole afternoon, and I finally completed it. The text had things like “concentrate your chi in your feet,” which was confusing, but I definitely had it in me to do this. I was exhausted then, and I grabbed my card and travelled to the cafeteria, ate my pleasant dinner, and stopped by the Treasury for the Axis Piece.", "As soon as I walked in the door, the glowing purple gem was by my feet. I picked it up, finding the sheer power in there. It was trying to push me, trying to invert me from the outside in. I resisted, and the piece got tired and gave up. Strange how these things have a mind of their own. It seemed to disappear and I felt my power surge. I was no longer tired, and I felt that I could run around the earth five times without stopping. At the speed of light, too! Somehow, the Axis Piece seemed to find me without me finding it. <em>They should’ve found the one by the door by now. So that has to be one they know is there. But the other one? They probably still haven’t found it yet.<\/em> I headed inward, surfing down a pile of treasures. Gold, rubies, diamonds, emeralds, silver, and all the manner of treasures lay scattered across the floor in a glimmering heap. There was a crew with MagnaFlux 3500 detectors in there, searching for the Axis Piece. I stepped over and talked to them.", "“Hey, what are you doing?” I asked them.", "“Searching for the Axis Piece. We’ve spent all day trying to find it. It is just hard to find. Once, we picked up a strong signal, we would reach over and get closer, but the signal stops. When we walk, the signal starts up again. This is very mysterious.” one of them sadly reported.", "“Lemme try,” I replied. I did not know what I was looking for, but I was pretty sure that it was something peculiar or out of place. Though in the end, I discovered that finding treasures in an open, unorganized treasury is finding a needle in a haystack…", "But several times bigger. And harder. I probably found out the hard way."], "tall": false}, {"id": "chapter-9", "n": "9", "label": "Chapter 9", "title": "Treasure", "img": "10.jpg", "paras": ["Many people have a hard time finding a needle in a haystack. Now imagine the haystack as forty times bigger, and you don’t know what you’re looking for. Hay and needle look alike. That was what the search was like.", "I tried recalling what I’d felt while getting to the crew. <em>Wait, did I feel something while surfing down that pile? Yes. But where? Near the end? Or was it the beginning? Maybe in the middle. How strong did I feel it? I’m not sure. Try comparing it to the Axis Piece I found, then it was powerful. That’s it! Maybe it is on the surface, hidden in plain sight.<\/em> I ran over to the pile that I slid down off of a little earlier, and sat down. All of the pile was still…", "Except for one little patch that kept bulging out. I stood up and brushed aside the gold and silver coins to find a gold ring. Nothing much, but it seemed powerful. I touched it and the pile was still again. I pulled my hand back, and it started spinning erratically. I had found it. The mysterious Axis Piece. I had already taken the power of one piece, and I desperately wanted more. But no. I had to exercise restraint and reluctantly brung the piece down to Kreigh’s office. I walked down there again, walking past the familiar yet still strange hallways. When I got there, I opened the door.", "Suddenly, a hooded figure jumped down from the ceiling. It grabbed me and pulled me up through the ceiling boards, revealing a secret passageway. The figure put its finger to its lips, and quietly slid the board back into place. When it pulled down its hood, I saw Kreigh.", "“We have been discovered. The walls have been breached. A singular Eye of Providence had entered on the morning patrol. And it is heading for the office. Quick, get away,” he whispered.", "“But why?” I asked, “I want to fight it! Show that dirty creature the true meaning of pain!”", "“You must restrain yourself. If it escapes, then it will immediately bring news of its defeat at the hands of the rebels and will leak this location as a rebel base! If it sees nobody, it reports nothing. People have seen it but it has not seen anybody. Now hush!”", "“Fine! I’m going on my own!” I replied. I crashed down through the ceiling boards, and ran out the door. My timing was perfect, as the Eye of Providence stared me down across the hall. I dashed towards it, circling it while drawing RAD. The Eye drew a blade and placed it in front of me, but I jumped, and the blade stuck to my foot. The blade sailed towards the beast’s eye, and pierced right through to the back of its head. I rushed to the opposite side of the hall and did a flying kick straight to its head. The head ripped off like that of a doll. Blood splattered everywhere, adding another fresh layer to that already on the spiked walls of the trapped hallway. I quickly retrieved the beast’s spare blade and leaped out of the way, just as the spiked walls closed on the intruder. Immediately, the lights came back on, and the base returned to normal operation.", "When I returned to Kreigh’s office, he asked me how I did it.", "“Was it the relic?” he asked me.", "“Maybe? Maybe it was also my training,” I replied", "“You couldn’t have done it just like that. That specific technique takes many years to master. How did you do it so quickly?”", "“I found the Axis Piece,\" I handed him the rotating ring. He put it down on the table, leaving it to meander around in an infinity shape.", "“Did you find another one?” he asked.", "“Yes, but I don’t know what happened to it,” I answered", "“Did your power surge?”", "“Yes.”", "“Wait…the Piece must have corrupted you!”", "Kreigh muttered something under his breath, and then slammed down on the table. The slam caused the Axis Piece to vibrate, and unstable, it warped away. Kreigh was fuming now.", "“I ORDER YOU, GO INTO QUARANTINE, IMMEDIATELY!”"], "tall": false}, {"id": "chapter-10", "n": "10", "label": "Chapter 10", "title": "Quarantine", "img": "11.jpg", "paras": ["I did not question it, because the rules were that nobody questions a leader’s orders. I reluctantly slunk back to my room, gathered my belongings, and walked to quarantine. Quarantine was where operatives with disease or poison were kept, along with those who had messed up plans or needed to be questioned. I was either here for messing up plans or needing to be questioned. Either one was bad. And now, we lost the Axis Piece. I sighed and plopped down on my bed. It was a little uncomfortable, but I didn’t care. As the days passed, each day with just two meager meals and always someone trying to force the Axis Piece out of me, I started plotting my daring escape. It was to slip out of my cell using a missing stone block near the ceiling into an adjacent cell, use the crack in the wall in that to get into the between spaces of the camp, spy a little bit, and escape through a crack on the surface, or just dig through the earthen ceiling and bring chaos and destruction below.", "However, the Rebellion was innocent, so I didn’t want to bring them trouble. But part of me was also wanting their rebellion to be exposed, for me to live in the Haven for my help in defeating the rebels once and for all, to live a lavish life of luxury and the latest tech, maybe kill The Grand Xenoph himself when so many others had failed, and get my sweet revenge on Kreigh for betraying me.", "Whatever I did, I knew the latter was wrong, but it shouldn’t even come to my mind at all. Something seemed wrong with me. Did the Axis Piece really corrupt me? Only later I would know.", "After what seemed like eons of thinking, I finally decided something. I should not be here. Or, I don’t think that was my thought. It was another voice, like mine but deeper, more powerful and commanding. I felt like this voice was me, even though I knew it was not. I decided that we—er, <em>I<\/em> should not be here anymore. I reached out, channeling my energy. Purple lightning with red sparks dancing within enveloped my hands, and I focused on moving my lower body, making my upper body swoop up into the wall, flexing and tensing my fingers in a pattern. A shockwave rippled through the wall, like a giant tuning fork, but I held my ground. Sweat came down my forehead as I struggled to control the energy of the Axis Piece within me, but I managed to keep the energy from exploding everywhere. I grabbed the wall like a piece of paper, and ripped a chunk straight out. The blocks bounced back to their original shape, and I finally tasted freedom. I was free. <em>Good<\/em>, the voice rasped. And so I snuck out of the hole in the wall, passing all the in-between chambers of the rebel base. From where I came from, sirens blared loudly. I heard Kreigh mutter something about stupid newbies, as I ran through the walls. I stealthily slunk through a trapdoor as I left the Rebel base, to see something horrible. They found us."], "tall": false}, {"id": "chapter-11", "n": "11", "label": "Chapter 11", "title": "Invasion", "img": "12.jpg", "paras": ["Hurriedly, I rushed back to Kreigh’s office. The hallways were teeming with operatives just like me, rushing in the opposite way I was going. I then scrambled in the office, and Kreigh sat there, his lips a thin line, and a glare in his eyes.", "“What are you doing here?” Kreigh snarled. “You’re supposed to be in Quarantine!”", "“General Darkblade amassed all his forces! They’re right outside!”", "Kreigh’s eyes quickly widened.", "“How did they figure out where the base is?” He questioned.", "“I dunno! The point is, we have to go fast!” I responded.", "“Surrender now,” General Darkblade’s voice boomed as it echoed throughout the base, “And we just might consider making your deaths more peaceful!”", "Kreigh started sweating. “Stupid newbies! They must have defected and leaked our location!” he fumed. He picked up a broadcasting device. “ALL OPERATIVES, ASSEMBLE! THE BASE IS UNDER ATTACK!”", "Gunfire rang out through the halls, flashes of lasers lit up the portion of the hallways on camera. The monitors were all filled with an emergency warning bearing a photo of the Illuminati storming the base. They’d invaded the top municipal floor, compromising the main cafeteria, looting it thoroughly. The Great Library was next to fall. We could only watch helplessly as they swarmed over the dead bodies of operatives, while we waited for the end in the deep depths of the base. Now they got into the Quarantine room. Thank goodness I wasn't there! However, something deep inside me that was hungry for power drove me to rush out the door into combat. I mowed down row after row of Illuminati members, sending their heads rolling across the floor. I kicked one like a soccer ball and it hit another member smack in the face, who had gleaming armor that kind of made me shiver in fear.", "<em>Wait, where had I seen it before?<\/em> I dodged to the side, skirting the terrifying armored figure. Creeping up on an Illuminati Lieutenant, I tiptoed silently. I got my hands into position, jittered my fingers, and leapt onto him. You should have seen the look on his face! It was so funny, twisted in a contortion of surprise, anger, fear, and regret. Open-mouthed, the Lieutenant tried scrambling back, but it was no use. I grabbed hold of his chest, purple electricity sparking, preparing to crush him into the size of an atom. He trembled in fear, thinking of the dark death he was not prepared to die. I didn’t care. Rather, I wanted him to feel as much pain as possible, given my deep grudge against the Republic.", "A shrill scream pierced the chaos of the battle. I sunk my fingers into his chest, seeing him crumple up into a piece of paper, down into a singularity. The Ball of Illuminati Lieutenant immediately caused some things besides me to gravitate towards it. The ball shrunk, and shrunk, and shrunk, growing ever smoother, permanently getting rid of that filthy scum. It shrunk to the size of a pinhead, where I decided that it was not safe to carry anymore. Wind ripped through the chamber, though it was entirely underground and not exposed to the surface. The chaos in the room cleared, while still, hurricane-force winds ran rampant around the combatants. Rebel and Illuminati alike braced themselves against the wind, struggling not to get blown away. And that’s when I threw it. Smaller, smaller, and smaller the ball got, smaller than any atom.", "Suddenly, an extremely loud boom threw everyone to the floor. A ball of superheated plasma illuminated the space around the newly formed black hole, blasting an opening straight through the wall, all the way to the other side of the Earth. In a blink of an eye, it was gone. <em>Bon Voyage, useless scum! You’ll have much more use out there in space!<\/em>", "<em>Good riddance, the voice snarled.<\/em>", "The Illuminati fled in fear, retreating, never to be seen in the Lower Levels ever again. Around me, fellow rebels cheered. They congratulated me on driving out the invaders, opening a path up to the surface. I gladly accepted their praise, but warned them not to get cocky and that the Illuminati were still on the top floors.", "As I chased down the remaining cowards fleeing the Lower Levels, I heard another announcement on the loudspeakers: “Attention all operatives, the Republic Forces have been driven out of the Lower Levels. Please aid our rank A defender Nyk in pushing through and breaching the surface, to reclaim our Municipal Floor. Let’s all unite and defeat this incursion once and for all!”", "Almost immediately, my fellow comrades rushed to my side. We fought a fierce battle up the stairs (who needs them when you can take the elevator, but the Illuminati could just cut the power and we would plummet to our doom) and broke out onto the Municipal floor, to find that so many guns were pointed at us.", "“Hands up! Rebels, this is the end!” barked one of the Illuminati.", "I shifted in my pants. Everyone knew when one of them says these same exact words, everyone in the vicinity who is not with them will immediately be murdered mercilessly. So I thought of a distraction.", "“Bring me to see Ivan,” I commanded, “I have important matters to discuss with him.”", "“So you’re their leader?” they questioned.", "“Second in command, to some extent. Win, quick!” I shouted.", "“Huh?” the Illuminati,”What do you mean, is that your name? Or do you want us to kill you to win this battle and smite the rebels once and for all?”", "In a flash, Win Setose appeared by my side. “Win Setose, at your service!”", "And that’s when the Illuminati started firing. We all ducked, dodging lasers left and right, while Win parried them with his blade whirlwind, but a measly sword was no match for hundreds of lasers. It slowly got chipped and damaged, and then snapped and fell to the floor with an awful clang. As soon as that happened, a laser hit Win straight in the chest, and he doubled over in pain, falling onto the point of his shattered blade. He howled with the fury of a demon, and went on a rampage, disarming one Illuminati member and shooting the rest with their gun. I joined in, making quick work out of one member and throwing a blade around the center of gravitation I made with the corpse, piercing them to make an Illuminati kabob. The Haven Forces were almost done with, until one muscular figure with gleaming armor stood in the entrance to our underground base. Guess who it was?", "Ivan Damazcus."], "tall": false}, {"id": "chapter-12", "n": "12", "label": "Chapter 12", "title": "Revelation", "img": "13.jpg", "paras": ["“H-H-HOW?!?”", "These were the first words uttered by Ivan Damazcus when we ran into him, fuming at the sight of his own forces’ defeat.", "“How could we lose to this ragtag band of rebels? Nevermind that. Nyk Valios, we’ll find you and quash your rebellion! You think you can defy The Grand Xenoph for so long? Well, when we get our hands on you, you’ll die the worst death ever imaginable! Just remember, The Grand Xenoph sees all! The Grand Xenoph knows all! The Grand Xenoph is all-powerful!” Ivan proclaimed.", "“How do you know my last name? Anyways, well, your forces were not well-coordinated because you don’t have the floor plan. Secondly, we’ve become more powerful. We aren’t the Rebellion you used to know. See you in the Haven, where we will end The Grand Xenoph’s reign of terror once and for all!” I spat.", "“Nonsense! The Grand Xenoph is all-powerful! If I bring him to see all of you, he shall end you easily!”", "“No, The Grand Xenoph is just a pudgy ruler who needs us! We don’t need to work for him at all! But you! You and your stinking forces and this corrupt autocracy restrict our freedom!”", "“We obey The Grand Xenoph because he is all-powerful. What choice do we all have but to serve him?”", "“One: Get rid of him.”", "“Well, we’d need the whole entire world population, or a well-constructed plan that’s good enough to evade The Grand Xenoph’s all-seeing eye.”", "“Two: Pretend he doesn’t exist.”", "“He’s changed everything! The weather! The society!”", "“Actually, the society was changed by your dirty good-for-nothing group of evildoers!”", "“But what choice do we have? You all are all too stupid to understand!”", "“I think The Grand Xenoph has brainwashed you. Your life’s a lie!”", "“ENOUGH ARGUING ALREADY! General Darkblade! Send in the back-up troops!”", "“What back-up troops? Your forces are spent!”", "General Darkblade’s voice rang through the halls once more. “Charge!”", "Illuminati forces ran in through the entrance, encircling the stairwell. One by one, they jumped down and dueled with us. Rebel after rebel fell to the cruel blades and speeding lasers of the Republic. Win couldn’t hold up any longer. I was already exhausted, having expended both my Axis Piece’s and my energy. A blade whistled past my ear, following through, cutting a gash on my arm as I dodged. My movements became slow, barely dodging the barrage of attacks. Round after round of lasers peppered my body with burn wounds. All hope seemed lost until…", "A hooded figure rushed up from the Lower Levels, the signature grin on their face.", "“The Hooded Devil!” I exclaimed.", "“Shut up already and fight!” they retorted.", "“Fine…” I groaned. I noticed that Ivan had walked away, not wanting to be involved in anything with the Hooded Devil. Lasers flying here and there, and one grazed the Hooded Devil’s mask. It promptly fell off and I saw…", "“Princess Eliza?”"], "tall": false}, {"id": "chapter-13", "n": "13", "label": "Chapter 13", "title": "Victory", "img": "14.jpg", "paras": ["“Let’s not talk about it,” she snapped, “I don’t want my dad to know.” She promptly put her mask back on, while deftly taking a few swings at the remaining Illuminati, ensuring nobody would report her to her father.", "The reinforcement wave was much stronger than the initial invasion, now with the help of cannon turrets and lots of infantry units. We were outnumbered nearly four to one. However, the offensive got harder for the Illuminati, too, because a larger force is harder to manage. The Illuminati spread out, their coordination getting weaker with every advance. Splitting off into groups, we provoked some of the enemy troops to advance towards us, and we enclosed and polished them off one by one, reducing their numbers gradually. Win and I led groups to skirmish with the enemy, weakening units so that the Rebellion’s infantry could advance and break through. Gathering down the stairwell, we formed a wedge and drove through the enemy lines, charging into the heat of the battle. Enemy after enemy fell to laser fire and fists of fury. To shrieking blades and grenades, to long spears and daggers. Weapon use was as diverse as genetics in the Base, so every Illuminati soldier got a slightly different treatment. We blitzed them and left destruction in our wake.", "The enemy forces feigned retreat, but we saw through it. We held our positions, feinting and striking the other way to catch the confused enemy off guard. A fake retreat became a real one, as we cut the Illuminati line in two. The enemy took up defensive positions by flipping the cafeteria tables on their sides and hiding in the food court kitchens, but we kept them in check and under fire so they couldn’t leave their sanctuaries.", "Eliza chased down a fleeing unit all by herself, sword high in the air. I joined her in chasing off that unit, which seemed to be the last one that existed on the premises.", "She fought with precision and cleverly coordinated moves from one soldier to the next in what seemed like a single motion. As I watched, the last infantry spread out, encircling us and firing randomly. I saw, quite late, a laser aimed straight at my cranium, forcing me to duck. The soldier that shot let out a battle cry, and charged straight at me. He swung his blaster at me, and I ducked before the collision would come. However, I was so tired that I fell to the ground. He stared down at me, glaring, with a cunning smile. But I wouldn’t go down that easily. I hooked him in the back of his knee and he fell down, howling in pain. I started to run away, but that voice in my head struck back.", "<em>Kill him.<\/em>", "I paused when the voice whispered in my head. I had already won. Why did I need to end him? <em>All Republic scum need to die. They deserve it.<\/em> I finally understood. I needed to end him. For me. For all the poor residents of the New World Order. For all of humankind. For putting humanity in this state. I whirled back around and shot purple lightning. A satisfying scream told me the deed was done. Around us, bodies littered the ground. The rebels had suffered severe casualties, but the Illuminati forces were completely spent. <em>At least they won’t be bothering us for some time. Well done<\/em>.", "That evening, we had a banquet with hearty food that we pillaged from the Illuminati stockpile, fresh from the Haven. Huge bowls of fruit and foods from all over the world filled the table. Some pizza, like the one that I stole from the Haven before, roasted chicken, burgers, salads, noodles, some alien delicacy from The Grand Xenoph’s home planet, rice, you name it. I had never eaten so well in my whole life!", "People were dancing in the Great Hall, a lot of chatter was going on, and the highest ranked rebels were giving praise to new recruits.", "However, amidst all this revelry, everyone was in solemn moods.", "“I miss all my comrades. They were dear to me, like family. Forever friends, united by a common cause,” Win sobbed.", "“Me too. Even though I had only been in the Rebellion for a few weeks, I have also lost a lot of my friends. This place was just beginning to feel like home,” I agreed, tearing up. I thought of the thousands who fought for this cause, for humanity’s independence from extraterrestrial rule.", "Outside, rebels were heaping bodies of the Illuminati in a pile, ready to burn them and make a show of strength to the Haven and The Grand Xenoph. By burning the bodies along with the flag of the Supreme Republic, the Rebellion was effectively cementing itself as a dedicated foe of the authoritarian regime of terror and surveillance.", "After the banquet, we held a great funeral for all our fallen friends, our new family that we only got to meet for a few days. They just went so soon. I wish they could’ve stayed. I cried a lot.", "Walking slowly back to my room after the event, I received an urgent summons to Kreigh’s office.", "Rushing down the deserted passageways, I made haste and arrived within five minutes.", "“So, what do you need me for?” I asked, huffing and panting in the doorway.", "Kreigh sighed. “It’s been a long battle. But the Haven Forces will eventually regroup. Disaster is averted, at least for now. The Grand Xenoph has the whole human population under his hand. Do you think he’ll back down that easily?”", "“No. This battle is won, our hopes are not lost. But we all fear for what comes next.”", "“Sadly, yes. Gnarn was lost to his own hopes. His own legacy. His own Axis Piece. He, though outgoing, was too, corrupted by his piece. So the next time you hear that voice in your head, resist it.”", "“How do you know?”", "“Before he died, Gnarn told me that he’d been having visions. Of the Piece corrupting his soul. Of the whispers getting unbearable. Slowly, that madness accumulated. He was managing it well, but on that fateful day, he let loose and died.”", "“What if I’m gonna die at the hands of someone or something other than the Piece?”", "“Then follow its advice. Though malicious and power-hungry, these pieces are good companions at heart. Try having a nice chat with it sometime if you are just waiting for something.”", "“Are all pieces evil?”", "“No, they are not all evil. The Whole Axis is a sentient and intelligent being who can have complex emotions. Though the True Axis was usually emotionless, beneath the surface lie a struggle between dark and light. This was recorded by the last owner of it, someone from so long ago it could not really be documented. All we have are a few pieces of paper, that’s all. Go to the library for a transcription of the document. I feel like it will be of use.”", "“What’s it called?”", "“The True Axis: The Artifact Lost to Time”", "“But isn’t the library destroyed after the Republic raided it?", "“No, they kept all the books intact. They were going to establish a base on our top floors, so that they could keep an eye on us and use all our resources while we starved in the depths.”", "“But we proved to be too powerful for them.”", "“Exactly. There are some more useful documents we saved in the attic, too. I’m getting you and Myke to work on that. For now, you are dismissed.”"], "tall": false}, {"id": "chapter-14", "n": "14", "label": "Chapter 14", "title": "Research", "img": "15.jpg", "paras": ["The dust got in my eyes. That’s the first thing I was met with when I entered the decrepit attic with Myke.", "“Ack!” coughed Myke. “What’s that smell?” I shot him a look that screamed “This is serious!” Myke shrugged and pushed a box over. He picked up a book that read <em>Percy Jackson and the Lighting Thief<\/em> and tossed it aside. Then, he picked it up and started reading.", "“Myke!” I shouted. “Concentrate!”", "“B-but! What about stopping Hades?” asked Myke. I palmed my forehead.", "“Seriously? You’ve been sneaking up here just to read some twenty-first century novel by some random author? You literally should have no context!”", "“True, but I couldn’t help myself! This plot is literally amazing!”", "“Come on!” I complained. Then I glanced upon a book with a seemingly oversized jacket, which said, “The Kane Chronicles: The Red Pyramid” I picked it up and started reading.", "“Hah! Even you can’t resist the temptation to read a Rick Riordan book!” Myke joked.", "“Doesn’t this oversized book jacket look a little suspicious?”", "“Kinda. But who cares?”", "“We do. We’re looking for that text, right? They would hide it to not draw attention!”", "“Who would do that kind of thing?”", "“Nevermind. Lemme see, ‘We only have a few hours, so listen carefully.’ Then the story goes on but is abruptly cut off by… A blank page?”", "“So it was suspicious after all!” Myke exclaimed. He rushed over
